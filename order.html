<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0F19">
<title>Pesan — FluxyOS</title>
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  FluxyOS — the surface a diner sees after scanning the QR on their table.

  NO TAILWIND, DELIBERATELY. Every other app page loads the Tailwind Play CDN,
  and on 2026-09-02 that produced a WebKit-only failure: utilities are not
  generated in time for DOM injected at runtime, measured at 420px on Chromium
  against 1440px on WebKit for the same dialog with the CDN fully available.
  This page is mobile-Safari-first and its central interactions ARE injected
  bottom sheets, which is precisely that failure combination
  (docs/CUSTOMER_ORDERING_PLAN_REVIEW.md §1.5). It also removes a render-blocking
  script from the one page in the product loaded on a stranger's phone, on
  restaurant wifi, while they are hungry.

  NO FIREBASE SDK. A customer has no account and never signs in. Everything the
  page needs comes from two public endpoints — `qr-menu` and `qr-order` — which
  resolve the table's token with the Admin SDK. A browser holding a Firestore
  handle would need rules admitting an anonymous reader into a workspace, and
  there is no such rule that stays narrow.

  Amounts render through `window.FluxyMoney.formatBase`, never a local
  formatter: the workspace's base currency may be PHP, where amounts are stored
  in cents and a hardcoded id-ID + Rp renders 100x the money with no error.
-->

<!-- ⚠️ ABSOLUTE, NOT RELATIVE. The printed entry point is `/t/<token>`, so a
     relative `assets/...` resolves to `/t/assets/...` — and the `/t/*` rule
     rewrites EVERYTHING under /t/ to this page, so that request returns **200
     with this HTML**, not a 404. The browser then refuses to run HTML as a
     script, `window.FluxyMoney` is undefined, and `money()` silently falls back
     to the raw integer: every price on the menu renders as a bare number with
     no currency symbol and no thousands separators.

     No error, no crash, a plausible wrong number on a customer's phone — the
     exact failure mode CLAUDE.md opens with. It reached production because the
     spec loaded `/order.html?t=…` rather than the route a diner actually uses;
     `customer-ordering.spec.js` now drives `/t/<token>`. -->
<script src="/assets/js/money-format.js"></script>
<style>
/* ==========================================================================
   Tokens — the subset of the design system this page needs, inlined. It cannot
   import shared-dashboard.css: that file is 6k lines of app chrome and this
   page must paint on a phone in one round trip.
   ========================================================================== */
:root {
    --ink:          #0B0F19;   /* brand dark navy — primary surfaces and CTAs */
    --ink-70:       #4B5563;
    --ink-50:       #6B7280;
    --ink-30:       #9CA3AF;
    --line:         #E5E7EB;
    --line-soft:    #F3F4F6;
    --surface:      #FFFFFF;
    --canvas:       #F9FAFB;
    --accent:       #EA580C;   /* ACCENT ONLY — never a background (CLAUDE.md) */
    --accent-soft:  rgba(234, 88, 12, 0.10);
    --ok:           #047857;
    --danger:       #B91C1C;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 20px;

    --shadow-sheet: 0 -8px 40px -12px rgba(11, 15, 25, 0.22);
    --shadow-bar:   0 -2px 16px -8px rgba(11, 15, 25, 0.18);

    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* How much room the floating tab bar occupies at the bottom. Read by the
       cart bar and by the menu's trailing spacer, so the three can never
       disagree about where the bottom of the page is.
       MEASURED AT RUNTIME by syncTabbarSpace() — this value is only the
       pre-paint fallback. Hard-coding it means every restyle of the bar
       silently re-introduces an overlap, which is what happened. */
    --tabbar-space: calc(66px + var(--safe-bottom));
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    /* iOS Safari zooms a page when an input's font-size is under 16px. Every
       input below is 16px for that reason and not for emphasis. */
    -webkit-text-size-adjust: 100%;
}

/* Numbers are Inter with tabular figures and a plain zero. A monospace face is
   banned project-wide — it renders a slashed zero (DESIGN_SYSTEM.md). */
.num {
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum' 1, 'zero' 0;
}

button { font: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

.hidden { display: none !important; }

/* ==========================================================================
   App frame
   ========================================================================== */
#app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--canvas);
    position: relative;
}

/* ---- Full-screen states (loading / error / confirmation) ---------------- */
.state {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    gap: 12px;
}
.state h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.state p  { font-size: 14px; color: var(--ink-50); margin: 0; max-width: 34ch; }

/* ── The FluxyOS loading animation ──────────────────────────────────────────
   The same one the app uses while reading a statement or a receipt
   (`.scan-loader-*` in shared-dashboard.css): a pulsing white card holding the
   slowly-spinning F, inside a purple halo, with twinkling stars around it.

   REBUILT IN PLAIN CSS RATHER THAN IMPORTED. The originals are Tailwind-class
   compositions and this page deliberately carries no Tailwind — and pulling in
   shared-dashboard.css for a splash screen would put 6k lines of app chrome in
   front of a hungry diner on restaurant wifi. The keyframes and the palette are
   copied so the motion is recognisably the same. */
.loader {
    position: relative;
    width: 132px; height: 132px;
    display: flex; align-items: center; justify-content: center;
}
.loader-halo {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 25%, #A78BFA 50%, #C4B5FD 70%, #7C3AED 100%);
    background-size: 300% 300%;
    animation: scanBgPan 6s ease-in-out infinite;
    opacity: 0.55;
    filter: blur(26px);
}
.loader-halo.inner { inset: 14px; filter: blur(10px); opacity: 0.45; }
.loader-card {
    position: relative;
    width: 76px; height: 76px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 12px 28px -10px rgba(11, 15, 25, 0.35);
    display: flex; align-items: center; justify-content: center;
    animation: scanLogoPulse 2.4s ease-in-out infinite;
    will-change: transform;
}
.loader-card img { width: 44px; height: 44px; animation: scanLogoSpin 7s linear infinite; }

.loader-star {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 999px;
    background: radial-gradient(circle, #DDD6FE 0%, #7C3AED 55%, transparent 100%);
    box-shadow: 0 0 8px rgba(124, 58, 237, 0.55);
    animation: scanStarTwinkle 2.6s ease-in-out infinite;
    pointer-events: none;
}
.loader-star.sm { width: 4px; height: 4px; }
.loader-star.lg { width: 8px; height: 8px; box-shadow: 0 0 12px rgba(124, 58, 237, 0.6); }

@keyframes scanBgPan {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
@keyframes scanLogoPulse {
    0%, 100% { transform: scale(0.86); }
    50%      { transform: scale(1.16); }
}
@keyframes scanLogoSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}
@keyframes scanStarTwinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50%      { opacity: 1;    transform: scale(1.35); }
}

@media (prefers-reduced-motion: reduce) {
    .loader-halo, .loader-card, .loader-card img, .loader-star { animation: none; }
    * { transition-duration: 0.01ms !important; }
}

/* ==========================================================================
   Header — outlet identity and the table the diner is sitting at
   ========================================================================== */
/* One line: the business, and which table you are sitting at. There was an
   eyebrow above this reading "Pesan dari meja Anda" — removed, because the H1
   and the table chip already say exactly that, and a label restating the
   headline is prohibited (CLAUDE.md). Dropping it also reclaims the vertical
   space the header was wasting above the menu. */
.masthead {
    /* Navy into the brand purple, with a warm bloom top-right. The orange lives
       ONLY inside the gradient — an orange background is prohibited
       project-wide, and gradients are the documented exception. */
    background:
        radial-gradient(120% 140% at 88% 0%, rgba(234, 88, 12, 0.28) 0%, transparent 55%),
        linear-gradient(135deg, #0B0F19 0%, #171334 52%, #2A1B4A 100%);
    color: #fff;
    padding: 18px 20px 20px;
    border-radius: 0 0 var(--r-xl) var(--r-xl);
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
}
.masthead h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0;
    /* THE TABLE CHIP MUST ALWAYS SIT BESIDE THE NAME, so the name truncates
       rather than wrapping and pushing the chip onto a second line. `min-width:
       0` is what actually permits it: a flex item will not shrink below its
       content without it, and the ellipsis silently never appears.

       Truncating is the right trade here. The diner is sitting IN the business
       and does not need its full legal name read back to them; they do need to
       know which table the order is going to, and a real name like "Kopi Senja
       Kemang" fits whole anyway. Only a long one clips. */
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.table-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.16);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
}
.table-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
}

/* ==========================================================================
   Sticky search + category rail
   ========================================================================== */
.rail {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--canvas);
    padding: 12px 0 0;
    border-bottom: 1px solid var(--line);
}
.searchwrap { padding: 0 20px 10px; }
.search {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    outline: none;
}
.search::placeholder { color: var(--ink-30); }
.search:focus { border-color: var(--ink-30); }

/* ── Category tabs ─────────────────────────────────────────────────────────
   The connected-tab strip from the reference: rounded-top tabs sharing one
   baseline, the active one lifted forward in the page surface while the rest
   sit back in a tinted trough. Icon over label, because a rail of words has to
   be read and a rail of pictures does not.

   SVG, NOT EMOJI. The reference uses emoji and emoji are a per-device font
   lottery — the same category is a flat glyph on one Android, a 3D sticker on
   an iPhone, and a blank box on some. These are drawn here, so the menu looks
   the same on every phone that scans the card, and they cost no request. */
.chips {
    display: flex;
    align-items: flex-end;
    gap: 0;
    overflow-x: auto;
    padding: 8px 14px 0;
    margin-top: 2px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    /* The trough the inactive tabs sit in. */
    background: linear-gradient(180deg, var(--canvas) 0%, #EEF1F6 100%);
}
.chips::-webkit-scrollbar { display: none; }

.chip {
    flex: 0 0 auto;
    width: 84px;
    padding: 9px 6px 10px;
    border: none;
    background: #E4E9F0;
    color: var(--ink-50);
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
    /* Tabs overlap slightly so the strip reads as one connected object rather
       than as separate pills. */
    margin-right: -6px;
    position: relative;
    transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
}
.chip:last-child { margin-right: 0; }
.chip .cat-ico { display: flex; align-items: center; justify-content: center; height: 30px; }
.chip .cat-ico svg { width: 26px; height: 26px; color: var(--ink-50); transition: color 0.16s ease; }
.chip .cat-name {
    display: block;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* The active tab comes FORWARD: page-surface background, raised above its
   neighbours, and taller so it visually joins the menu below it. Orange stays
   an accent on the icon and the label — never a background. */
.chip[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 700;
    z-index: 2;
    padding-bottom: 14px;
    margin-bottom: -4px;
    box-shadow: 0 -2px 10px -4px rgba(11, 15, 25, 0.18);
}
.chip[aria-pressed="true"] .cat-ico svg { color: var(--accent); }

/* ==========================================================================
   Menu — a two-column grid
   ==========================================================================
   Was a full-width list. A grid shows roughly twice as many dishes per screen,
   which matters on a phone held over a table, and it gives the photo real
   estate a list row cannot: a 4:3 tile the width of the card rather than an
   84px thumbnail. */
.menu { padding: 4px 0 0; }

.group-head {
    padding: 18px 20px 8px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-50);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 20px;
}
/* Roomier phones and the 640px desktop frame get a third column rather than
   two very wide cards. */
@media (min-width: 520px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
}

.card {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* The whole card is the tap target, not just the button. */
    text-align: left;
    padding: 0;
    color: inherit;
    /* Depth instead of an outline. A grid of hairline boxes reads as a
       wireframe; a soft shadow makes each card an object on a surface. */
    box-shadow: 0 2px 10px -4px rgba(11, 15, 25, 0.10), 0 1px 2px rgba(11, 15, 25, 0.04);
    transition: transform 0.14s ease, box-shadow 0.14s ease;
}
.card:active {
    transform: scale(0.985);
    box-shadow: 0 1px 4px -2px rgba(11, 15, 25, 0.12);
}

/* FIXED 4:3 with `contain`, matching the till exactly — the same image appears
   on both surfaces, and `cover` crops the part of a dish that identifies it
   (docs/CUSTOMER_ORDERING_PLAN_REVIEW.md §4). */
.card-media {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--line-soft);
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
/* MOST MENUS ARE MOSTLY UNPHOTOGRAPHED, so the placeholder is what the grid
   actually looks like — and a field of identical grey rectangles reads as a
   broken page rather than a menu. Each tile takes a warm tint keyed to the
   category, so the grid has colour and the eye can tell sections apart while
   scrolling. Kept low-saturation: it must sit behind a real photo without
   competing when one arrives. */
.card-media.is-placeholder { background: var(--tint, linear-gradient(150deg, #FFF3E9, #FDE9DA)); }
.card-media.is-placeholder svg { color: rgba(11, 15, 25, 0.28); }
/* ABSOLUTELY POSITIONED, and it has to be. With `height: 100%` in a box sized
   only by `aspect-ratio`, the height resolves against an indefinite container —
   so it falls back to `auto` and a SQUARE source image makes the tile square,
   overriding the 4:3 and leaving the grid ragged. That is the exact defect the
   placeholder exists to prevent, arriving from the other direction. Taking the
   image out of flow makes the aspect-ratio the only thing setting the height. */
.card-media img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
}
.card-media img.failed { display: none; }
.card-media.is-placeholder svg { width: 36px; height: 36px; }

.card-body {
    padding: 10px 11px 12px;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    gap: 4px;
}
.card-name {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
    /* Two lines then ellipsis. A grid cell has no room to grow sideways, and a
       ragged card height breaks the row. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.4em;
}
.card-price { font-size: 15px; font-weight: 700; letter-spacing: -0.015em; }
.card-opts { font-size: 11px; color: var(--ink-50); }

.card-foot { margin-top: auto; padding-top: 8px; }

.add-btn {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    /* Orange as an ACCENT — the border, the label, a whisper of tint. Never as
       a filled background (CLAUDE.md). */
    border: 1px solid rgba(234, 88, 12, 0.42);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
}
.add-btn:active { background: rgba(234, 88, 12, 0.18); }

.stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(234, 88, 12, 0.42);
    border-radius: 10px;
    overflow: hidden;
    height: 34px;
}
.stepper button {
    width: 34px; height: 100%;
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 17px;
    font-weight: 700;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.stepper button:active { background: rgba(234, 88, 12, 0.18); }
.stepper .qty {
    flex: 1 1 auto;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    background: var(--surface);
}

.empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-50);
    font-size: 14px;
}

/* ==========================================================================
   Cart bar — the persistent bottom affordance
   ========================================================================== */
/* Floats ABOVE the tab bar rather than replacing it — the cart is a state, the
   nav is always there. `--tabbar-space` keeps the two from ever overlapping and
   is the single number both this and the page's bottom padding read. */
.cartbar {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(var(--tabbar-space) + 8px);
    z-index: 40;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
    transform: translateY(calc(100% + var(--tabbar-space) + 16px));
    transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
}
.cartbar.is-open { transform: translateY(0); }

.cartbar button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 18px;
    /* THE primary action on the page now that the cart tab is gone. Sized and
       lifted to say so. */
    box-shadow:
        0 2px 6px rgba(11, 15, 25, 0.10),
        0 16px 34px -12px rgba(11, 15, 25, 0.55);
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}
.cartbar button:disabled { opacity: 0.55; }
.cartbar .cb-left { display: flex; align-items: center; gap: 10px; }
.cartbar .cb-count {
    min-width: 22px; height: 22px;
    padding: 0 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    font-size: 12px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
}

/* ==========================================================================
   Floating tab bar
   ==========================================================================
   A detached pill rather than an edge-to-edge bar. On a phone held one-handed
   over a table the bottom edge is where the thumb rests and where iOS puts its
   home indicator, so a bar pinned to it collects accidental taps; floating it
   clear of both is the Airbnb pattern and it is a usability choice, not a
   decorative one.

   It sits UNDER the sheets (z-index 60) and under the scrim, so an open sheet
   is never competing with navigation. */
.tabbar {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(10px + var(--safe-bottom));
    z-index: 35;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
    pointer-events: none;
}
.tabbar-inner {
    pointer-events: auto;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.86);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 999px;
    padding: 7px;
    /* Two shadows: a tight contact edge and a wide soft lift. One alone reads
       as either a sticker or a smudge. */
    box-shadow:
        0 1px 2px rgba(11, 15, 25, 0.06),
        0 14px 34px -14px rgba(11, 15, 25, 0.38);
}
.tab {
    flex: 1 1 0;
    max-width: 132px;
    border: none;
    background: none;
    border-radius: 999px;
    padding: 8px 12px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-50);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    position: relative;
    transition: color 0.16s ease, background 0.16s ease;
}
.tab svg { width: 21px; height: 21px; }

/* ACTIVE IS ORANGE — icon, label, and a soft tint behind it. Orange is the
   brand accent and this is an accent use: the tint is a 10%-alpha wash, not an
   orange background (CLAUDE.md prohibits the latter project-wide). */
.tab[aria-current="true"] {
    color: var(--accent);
    background: var(--accent-soft);
}
.tab[aria-current="true"] svg { stroke-width: 2.1; }

.tab .tab-badge {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(3px);
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
}
.tab .tab-badge.on { display: inline-flex; }

/* ==========================================================================
   Bottom sheets
   ---------------------------------------------------------------------------
   THE STRUCTURE IS REAL CSS, opened by a class, not by injected utilities.
   This is the specific pattern that failed on WebKit when it depended on the
   Tailwind Play CDN generating classes for runtime DOM.
   ========================================================================== */
.scrim {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(11, 15, 25, 0.44);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

.sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--shadow-sheet);
    transform: translateY(100%);
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex;
    flex-direction: column;
    max-height: 88vh;
    max-height: 88dvh;
}
.sheet.is-open { transform: translateY(0); }

.sheet-grip {
    width: 36px; height: 4px;
    border-radius: 999px;
    background: var(--line);
    margin: 10px auto 4px;
    flex: 0 0 auto;
}
.sheet-head {
    padding: 8px 20px 12px;
    border-bottom: 1px solid var(--line-soft);
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
}
.sheet-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
}
.sheet-sub { font-size: 13px; color: var(--ink-50); margin: 2px 0 0; }
.sheet-close {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: var(--line-soft);
    color: var(--ink-70);
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.sheet-body {
    padding: 4px 20px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 auto;
}
.sheet-foot {
    padding: 12px 20px calc(14px + var(--safe-bottom));
    border-top: 1px solid var(--line-soft);
    flex: 0 0 auto;
    background: var(--surface);
}

.primary {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: var(--r-md);
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.primary:disabled { opacity: 0.5; }

/* The submit button's loading state. */
.primary.is-busy::before {
    content: "";
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    animation: btnSpin 0.7s linear infinite;
    flex: 0 0 auto;
}
@keyframes btnSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .primary.is-busy::before { animation-duration: 2.4s; }
}

/* ---- Order status ------------------------------------------------------ */
.orders-loading {
    font-size: 13px;
    color: var(--ink-50);
    text-align: center;
    padding: 18px 0 4px;
    margin: 0;
    line-height: 1.5;
}
.orders-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0 4px;
}
.orders-no { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.orders-stage {
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px;
}

/* Four steps, not the till's seven — a diner has no reason to know the
   operational vocabulary, only whether to keep waiting. */
.track {
    display: flex;
    gap: 4px;
    margin: 12px 0 16px;
}
.track-step {
    flex: 1 1 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 600;
    color: var(--ink-30);
    text-align: center;
    position: relative;
}
.track-step::before {
    content: "";
    position: absolute; top: 4px; left: -50%; right: 50%;
    height: 2px; background: var(--line);
}
.track-step:first-child::before { display: none; }
.track-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--line); position: relative; z-index: 1;
}
.track-step.done { color: var(--accent); }
.track-step.done .track-dot { background: var(--accent); }
.track-step.done::before { background: var(--accent); }
.ghost {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink-70);
    font-size: 14px;
    font-weight: 500;
}

/* ---- Modifier groups --------------------------------------------------- */
.detail-hero {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: var(--r-md);
    background: var(--line-soft);
    overflow: hidden;
    margin: 12px 0 4px;
    display: flex; align-items: center; justify-content: center;
}
.detail-hero img { width: 100%; height: 100%; object-fit: contain; }
.detail-hero.is-placeholder {
    background: var(--tint, linear-gradient(150deg, #FFF1E4, #FDE3CE));
}
.detail-hero.is-placeholder svg { width: 56px; height: 56px; color: rgba(11, 15, 25, 0.28); }

.optgroup { padding: 16px 0 4px; border-bottom: 1px solid var(--line-soft); }
.optgroup:last-of-type { border-bottom: none; }
.optgroup-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
}
.optgroup-name { font-size: 14px; font-weight: 600; }
.optgroup-rule {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.optgroup-rule.optional { color: var(--ink-30); }

.opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line-soft);
}
.opt:last-child { border-bottom: none; }
.opt input { width: 20px; height: 20px; accent-color: var(--ink); flex: 0 0 auto; margin: 0; }
.opt-name { flex: 1 1 auto; font-size: 14px; }
.opt-delta { font-size: 13px; font-weight: 500; color: var(--ink-50); }

.note-input {
    width: 100%;
    min-height: 44px;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    resize: none;
    outline: none;
    color: var(--ink);
}
.note-input:focus { border-color: var(--ink-30); }

.field { margin-bottom: 14px; }
.field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-70);
    margin-bottom: 6px;
}
.field .hint { font-weight: 400; color: var(--ink-30); }
.field input {
    width: 100%;
    height: 46px;
    padding: 0 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    outline: none;
    color: var(--ink);
    background: var(--surface);
}
.field input:focus { border-color: var(--ink-30); }
.field input.invalid { border-color: var(--danger); }

.welcome-note {
    font-size: 11px;
    color: var(--ink-30);
    text-align: center;
    margin: 10px 0 0;
}

/* ---- Cart lines -------------------------------------------------------- */
.cartline {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 13px 0;
    border-bottom: 1px solid var(--line-soft);
}
.cartline-body { flex: 1 1 auto; min-width: 0; }
.cartline-name { font-size: 14px; font-weight: 500; }
.cartline-meta { font-size: 12px; color: var(--ink-50); margin-top: 2px; }
.cartline-price { font-size: 14px; font-weight: 600; margin-left: auto; align-self: center; }

.totals { padding: 14px 0 2px; }
.totals .line {
    display: flex; justify-content: space-between;
    font-size: 14px; padding: 4px 0; color: var(--ink-70);
}
.totals .line.grand {
    font-size: 16px; font-weight: 600; color: var(--ink);
    border-top: 1px solid var(--line);
    margin-top: 8px; padding-top: 12px;
}

/* Sits above the tab bar and the cart bar, because it is a reply to tapping
   one of them. */
.toast {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(var(--tabbar-space) + 74px);
    z-index: 45;
    max-width: 608px;
    margin: 0 auto;
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    line-height: 1.4;
    padding: 11px 14px;
    border-radius: var(--r-md);
    box-shadow: 0 12px 28px -12px rgba(11, 15, 25, 0.5);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.is-open { opacity: 1; transform: translateY(0); }

.cart-who {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding: 11px 13px;
    border-radius: var(--r-md);
    background: var(--canvas);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-50);
}
.cart-who strong { color: var(--ink); font-weight: 600; }

.notice {
    padding: 11px 13px;
    border-radius: var(--r-md);
    font-size: 13px;
    line-height: 1.4;
    margin: 12px 0 0;
    border: 1px solid var(--line);
    background: var(--canvas);
    color: var(--ink-70);
}
.notice.bad { border-color: rgba(185, 28, 28, 0.28); color: var(--danger); }

/* ---- Confirmation ------------------------------------------------------ */
.tick {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--ok);
    color: var(--ok);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 4px;
}
.order-no {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 2px 0 0;
}
.state .actions { margin-top: 22px; width: 100%; max-width: 320px; display: grid; gap: 10px; }
</style>
</head>
<body>

<div id="app">

    <!-- Boot ------------------------------------------------------------- -->
    <section id="view-loading" class="state">
        <div class="loader" aria-hidden="true">
            <span class="loader-star lg" style="top:2%;  left:12%; animation-delay:0.2s"></span>
            <span class="loader-star sm" style="top:16%; right:6%; animation-delay:1.1s"></span>
            <span class="loader-star"    style="bottom:12%; right:14%; animation-delay:0.5s"></span>
            <span class="loader-star sm" style="bottom:4%; left:28%; animation-delay:1.7s"></span>
            <span class="loader-star sm" style="top:46%; left:0%; animation-delay:0.9s"></span>
            <div class="loader-halo"></div>
            <div class="loader-halo inner"></div>
            <div class="loader-card">
                <img src="/assets/images/favicon.svg" alt="" onerror="this.style.display='none'">
            </div>
        </div>
        <p>Memuat menu…</p>
    </section>

    <!-- Dead / revoked / unknown token ----------------------------------- -->
    <section id="view-error" class="state hidden">
        <h1 id="error-title">Kode ini tidak aktif</h1>
        <p id="error-body">Minta staf untuk memindai ulang atau memberikan kode meja yang baru.</p>
    </section>

    <!-- The menu --------------------------------------------------------- -->
    <section id="view-menu" class="hidden">
        <header class="masthead">
            <h1 id="outlet-name">—</h1>
            <div class="table-chip"><span class="dot"></span><span id="table-label">—</span></div>
        </header>

        <div class="rail">
            <div class="searchwrap">
                <input id="search" class="search" type="search" inputmode="search"
                       autocomplete="off" placeholder="Cari menu…" aria-label="Cari menu">
            </div>
            <div id="chips" class="chips" role="group" aria-label="Kategori"></div>
        </div>

        <div id="menu" class="menu"></div>
        <!-- Clears the floating tab bar AND the cart bar above it, so the last
             card is never trapped under either. Derived from --tabbar-space so
             the three cannot disagree about where the page ends. -->
        <div style="height: calc(var(--tabbar-space) + 78px)"></div>
    </section>

    <!-- Order placed ----------------------------------------------------- -->
    <section id="view-done" class="state hidden">
        <div class="tick" aria-hidden="true">✓</div>
        <h1>Pesanan diterima</h1>
        <p id="done-sub">Dapur sudah menerima pesanan Anda.</p>
        <div class="order-no num" id="done-number">—</div>
        <div class="actions">
            <button class="primary" id="done-more">Pesan lagi</button>
        </div>
    </section>

</div>

<!-- Cart bar ------------------------------------------------------------- -->
<div id="cartbar" class="cartbar">
    <button id="cart-open" type="button">
        <span class="cb-left">
            <span class="cb-count num" id="cart-count">0</span>
            <span>Lihat pesanan</span>
        </span>
        <span class="num" id="cart-total">—</span>
    </button>
</div>

<!-- Floating tab bar. Menu and Cart are real destinations; Pesanan and Bantuan
     answer the two questions a seated diner actually asks after ordering. -->
<!-- Floating tab bar — TWO destinations, deliberately.
     "Keranjang" used to live here and did exactly what the floating cart bar
     below already does: open the cart. Two controls for one action means the
     prominent one is competing with itself, so the tab went and the cart bar
     is now unambiguously the primary action. "Bantuan" went too — it opened a
     sentence, not a screen. -->
<nav class="tabbar" aria-label="Navigasi">
    <div class="tabbar-inner">
        <button class="tab" type="button" data-tab="menu" aria-current="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
            <span>Menu</span>
        </button>
        <button class="tab" type="button" data-tab="orders" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 11h6M9 15h4"/></svg>
            <span class="tab-badge" id="tab-orders-badge">0</span>
            <span>Pesanan</span>
        </button>
    </div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="scrim" class="scrim"></div>

<!-- Order status. Read from the server, never from what this phone remembers:
     a cashier can void a line and the kitchen can mark a ticket ready, and a
     remembered list would be a confident lie about both. -->
<div id="sheet-orders" class="sheet" role="dialog" aria-modal="true" aria-labelledby="orders-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
        <div>
            <h2 class="sheet-title" id="orders-title">Pesanan Anda</h2>
            <p class="sheet-sub" id="orders-sub">—</p>
        </div>
        <button class="sheet-close" type="button" data-close aria-label="Tutup">✕</button>
    </div>
    <div class="sheet-body" id="orders-body"></div>
</div>

<!-- ── Identity gate ─────────────────────────────────────────────────────────
     Shown before the first order and dismissible ONLY by completing it: the
     kitchen needs a name to call when the food is ready, and a number to reach
     the table if something is out of stock. Persisted per browser, so a diner
     is asked once and not again on their second round.

     Deliberately NOT the scrim-dismissible pattern the other sheets use — the
     scrim click handler skips this one. -->
<div id="sheet-welcome" class="sheet" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
        <div>
            <h2 class="sheet-title" id="welcome-title">Selamat datang</h2>
            <p class="sheet-sub" id="welcome-sub">—</p>
        </div>
    </div>
    <div class="sheet-body" style="padding-top: 16px">
        <div class="field">
            <label for="welcome-name">Nama</label>
            <input id="welcome-name" type="text" maxlength="80" autocomplete="name"
                   inputmode="text" placeholder="Nama Anda">
        </div>
        <div class="field">
            <label for="welcome-phone">Nomor WhatsApp</label>
            <input id="welcome-phone" type="tel" maxlength="32" inputmode="tel"
                   autocomplete="tel" placeholder="08…">
        </div>
        <div id="welcome-error"></div>
    </div>
    <div class="sheet-foot">
        <button class="primary" id="welcome-go" type="button">Mulai pesan</button>
        <p class="welcome-note">Tidak perlu membuat akun. Meja Anda sudah terhubung lewat QR.</p>
    </div>
</div>

<!-- Item detail sheet ---------------------------------------------------- -->
<div id="sheet-item" class="sheet" role="dialog" aria-modal="true" aria-labelledby="item-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
        <div>
            <h2 class="sheet-title" id="item-title">—</h2>
            <p class="sheet-sub num" id="item-price">—</p>
        </div>
        <button class="sheet-close" type="button" data-close aria-label="Tutup">✕</button>
    </div>
    <div class="sheet-body" id="item-body"></div>
    <div class="sheet-foot">
        <button class="primary" id="item-add" type="button">
            <span>Tambah</span><span class="num" id="item-add-total"></span>
        </button>
    </div>
</div>

<!-- Cart sheet ----------------------------------------------------------- -->
<div id="sheet-cart" class="sheet" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
        <div>
            <h2 class="sheet-title" id="cart-title">Pesanan Anda</h2>
            <p class="sheet-sub" id="cart-sub">—</p>
        </div>
        <button class="sheet-close" type="button" data-close aria-label="Tutup">✕</button>
    </div>
    <div class="sheet-body" id="cart-body"></div>
    <div class="sheet-foot">
        <button class="primary" id="cart-submit" type="button">
            <span>Order Sekarang</span><span class="num" id="cart-submit-total"></span>
        </button>
    </div>
</div>

<script>
(function () {
    'use strict';

    // =====================================================================
    // Endpoints. Relative, never absolute: this page is served from the order
    // origin AND from the monolith (SITE_ROLE unset) for local dev and
    // Playwright, and a hardcoded host would break one of them.
    // =====================================================================
    var FN = '/.netlify/functions/';
    var TOKEN = readToken();

    var menu = null;         // the endpoint's payload
    var cart = [];           // [{ item_id, name, unit_price, options:[], modAmount, note, qty, key }]
    var activeCategory = null;

    var detail = null;       // the item currently open in the detail sheet
    var submitting = false;

    //
    // Drawn here rather than taken from an emoji font: the same emoji is a flat

    // blank box. These look identical on every phone that scans the card.
    var ICON = {
        coffee: '<path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 9h2.5a2.5 2.5 0 0 1 0 5H16"/><path d="M6 3v2M10 2v3M14 3v2"/>',
        drink:  '<path d="M5 4h14l-2 4H7z"/><path d="M7 8l1.5 12h7L17 8"/><path d="M8 13h8"/>',
        rice:   '<path d="M3 15h18"/><path d="M5 15a7 7 0 0 1 14 0"/><path d="M12 5V3"/><path d="M8.5 8.5 7 7M15.5 8.5 17 7"/><path d="M3 19h18"/>',
        noodle: '<path d="M4 9h16"/><path d="M5 9c0 6 3 9 7 9s7-3 7-9"/><path d="M8 4v5M12 3v6M16 4v5"/>',
