        cake:   '<path d="M4 20h16v-6a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3z"/><path d="M4 15c2 1.5 3 1.5 5 0s3-1.5 5 0 3 1.5 5 0"/><path d="M12 8V5"/><circle cx="12" cy="4" r="0.8"/>',
        bread:  '<path d="M4 11a4 4 0 0 1 4-4h8a4 4 0 0 1 0 8v4a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-4"/><path d="M8 11h8"/>',
        grill:  '<path d="M6 3v7M10 3v7M14 3v7"/><path d="M4 10h12a6 6 0 0 1-12 0z"/><path d="M8 16l-2 5M12 16l2 5"/>',
        sea:    '<path d="M3 12c3-4 7-6 11-6 3 0 5 1.5 7 4-2 4-6 8-11 8-3 0-5-1.5-7-4z"/><circle cx="8" cy="11" r="0.8" fill="currentColor"/><path d="M18 8l3-3v10l-3-3"/>',
        veg:    '<path d="M12 21c-4 0-7-3-7-7 0-3 2-5 5-5 1.5 0 2 .5 2 .5S13 8 15 8c3 0 4 2 4 5 0 4-3 8-7 8z"/><path d="M12 9V5c0-1.5 1.5-3 3-3"/>',
        pizza:  '<path d="M12 3 3 20l9-2 9 2z"/><circle cx="10" cy="13" r="1" fill="currentColor"/><circle cx="14" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="17" r="1" fill="currentColor"/>',
        burger: '<path d="M4 9a8 5 0 0 1 16 0z"/><path d="M4 12h16"/><path d="M4 15h16a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/>',
        all:    '<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/>',
        plate:  '<path d="M3 17h18"/><path d="M5 17a7 7 0 0 1 14 0"/><path d="M12 7V5"/><circle cx="12" cy="4" r="1"/>'
    };

    // First match wins, so put the specific words before the general ones.
    var ICON_WORDS = [
        ['coffee', ['kopi', 'coffee', 'espresso', 'latte', 'americano', 'cappu']],
        ['cake',   ['dessert', 'pencuci mulut', 'manis', 'cake', 'kue', 'pudding', 'es krim', 'ice cream', 'sweet']],
        ['bread',  ['roti', 'bread', 'bakery', 'pastry', 'sandwich', 'toast']],
        ['pizza',  ['pizza']],
        ['burger', ['burger', 'sandwich']],
        ['noodle', ['mie', 'mi ', 'noodle', 'pasta', 'ramen', 'bakso', 'soto']],
        ['rice',   ['nasi', 'rice', 'makanan', 'main', 'food', 'meal', 'hidangan']],
        ['grill',  ['sate', 'satay', 'grill', 'bakar', 'bbq', 'ayam', 'daging', 'steak', 'meat']],
        ['sea',    ['seafood', 'ikan', 'fish', 'udang', 'cumi']],
        ['veg',    ['sayur', 'veg', 'salad', 'vegan', 'vegetarian']],
        ['snack',  ['cemilan', 'camilan', 'snack', 'gorengan', 'appetizer', 'pembuka', 'side']],
        ['drink',  ['minum', 'drink', 'beverage', 'juice', 'jus', 'tea', 'teh', 'soda', 'smoothie', 'milk', 'susu']]
    ];

    // A small, low-saturation palette for placeholder tiles. Keyed to the
    // category so sections are visually distinct while scrolling, and muted
    // enough that a real photo dropped into the same grid still wins the eye.
    var TINTS = [
        'linear-gradient(150deg, #FFF1E4, #FDE3CE)',   // peach
        'linear-gradient(150deg, #E9F5EF, #D7ECE0)',   // mint
        'linear-gradient(150deg, #FEF6E0, #FAEBC4)',   // butter
        'linear-gradient(150deg, #FDECEF, #F8D9DF)',   // blush
        'linear-gradient(150deg, #EDEDFB, #DEDEF6)',   // lavender
        'linear-gradient(150deg, #E7F1FA, #D4E6F6)'    // sky
    ];

    function categoryTint(name) {
        var key = String(name || 'lainnya').toLowerCase();
        var h = 0;
        for (var i = 0; i < key.length; i += 1) h = ((h << 5) - h + key.charCodeAt(i)) | 0;
        return TINTS[Math.abs(h) % TINTS.length];
    }

    function categoryIcon(name) {
        if (name === null) return ICON.all;
        var n = String(name).toLowerCase();
        for (var i = 0; i < ICON_WORDS.length; i += 1) {
            var words = ICON_WORDS[i][1];
            for (var j = 0; j < words.length; j += 1) {
                if (n.indexOf(words[j]) !== -1) return ICON[ICON_WORDS[i][0]];
            }
        }
        return ICON.plate;
    }

    function svg(body) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"'
            + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
    }

    // A plate and cover. Neutral enough for a drink or a dessert, which a
    // knife-and-fork glyph is not.
    var PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
        + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M3 17h18"/><path d="M5 17a7 7 0 0 1 14 0"/>'
        + '<path d="M12 7V5"/><circle cx="12" cy="4" r="1"/></svg>';

    var $ = function (id) { return document.getElementById(id); };
    var money = function (minor) {
        return window.FluxyMoney ? window.FluxyMoney.formatBase(minor) : String(minor);
    };
    var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    };

    /**
     * The table token. `/t/<token>` is the printed form — short enough to be a
     * legible QR — and `?t=` is accepted so a link can be pasted or forwarded.
     */
    function readToken() {
        var m = window.location.pathname.match(/\/t\/([A-Za-z0-9_-]{8,128})/);
        if (m) return m[1];
        var q = new URLSearchParams(window.location.search);
        var t = q.get('t') || q.get('token') || '';
        return /^[A-Za-z0-9_-]{8,128}$/.test(t) ? t : '';
    }

    function newRef() {
        var a = new Uint8Array(12);
        (window.crypto || {}).getRandomValues
            ? window.crypto.getRandomValues(a)
            : a.forEach(function (_, i) { a[i] = Math.floor(Math.random() * 256); });
        return Array.prototype.map.call(a, function (b) {
            return ('0' + b.toString(16)).slice(-2);
        }).join('');
    }

    function readSession() {
        try {
            var raw = window.localStorage.getItem(SESSION_KEY);
            if (!raw) return null;
            var v = JSON.parse(raw);
            return (v && v.name) ? { name: String(v.name), phone: String(v.phone || '') } : null;
        } catch (_) { return null; }   // private mode throws on read, not just write
    }

    function writeSession(v) {
        customer = v;
        try { window.localStorage.setItem(SESSION_KEY, JSON.stringify(v)); } catch (_) { /* in-memory only */ }
    }

    /**
     * The identity gate. Opened before the diner can order and closable only by
     * completing it — the kitchen needs a name to call when the food is ready,
     * and a number to reach the table when something is out of stock.
     *
     * Deliberately not scrim-dismissible: `closeSheets()` skips this one, and
     * the scrim's own click handler ignores it while it is open.
     */
    function openWelcome() {
        $('welcome-sub').textContent = menu && menu.table ? ('Meja ' + menu.table) : '';
        $('welcome-error').innerHTML = '';
        openSheet('sheet-welcome');
        // Not autofocused: on iOS that opens the keyboard over the sheet before
        // the diner has seen what is being asked of them.
    }

    function welcomeOpen() { return $('sheet-welcome').classList.contains('is-open'); }

    function submitWelcome() {
        var name = String($('welcome-name').value || '').trim();
        var phone = String($('welcome-phone').value || '').trim();
        var digits = phone.replace(/\D/g, '');
        var bad = null;
        $('welcome-name').classList.remove('invalid');
        $('welcome-phone').classList.remove('invalid');

        if (!name) { bad = 'Masukkan nama Anda dulu.'; $('welcome-name').classList.add('invalid'); }
        // Nine digits is the shortest real Indonesian mobile number. Checking
        // DIGITS rather than length lets someone type +62 812-3456-7890 with
        // whatever spacing their keyboard gives them.
        else if (digits.length < 9) {
            bad = 'Nomor WhatsApp belum lengkap.';
            $('welcome-phone').classList.add('invalid');
        }

        if (bad) {
            $('welcome-error').innerHTML = '<div class="notice bad">' + esc(bad) + '</div>';
            return;
        }
        writeSession({ name: name.slice(0, 80), phone: phone.slice(0, 32) });
        closeSheets({ force: true });
    }

    function show(view) {
        ['loading', 'error', 'menu', 'done'].forEach(function (v) {
            $('view-' + v).classList.toggle('hidden', v !== view);
        });
        // The cart bar belongs to the menu view only — it must not hover over
        // the confirmation screen offering to re-send an order already sent.
        if (view !== 'menu') $('cartbar').classList.remove('is-open');
    }

    function die(title, body) {
        $('error-title').textContent = title;
        if (body) $('error-body').textContent = body;
        show('error');
    }

    // =====================================================================
    // Boot
    // =====================================================================
    if (!TOKEN) {
        die('Kode meja tidak ditemukan', 'Pindai ulang kode QR di meja Anda.');
        return;
    }

    fetch(FN + 'qr-menu?token=' + encodeURIComponent(TOKEN))
        .then(function (r) {
            if (r.status === 429) throw new Error('busy');
            if (!r.ok) throw new Error('gone');
            return r.json();
        })
        .then(function (data) {
            menu = data;
            if (window.FluxyMoney) window.FluxyMoney.setBaseCurrency(data.currency || 'IDR');
            if (!Array.isArray(data.items) || !data.items.length) {
                die('Menu belum tersedia', 'Silakan panggil staf untuk memesan.');
                return;
            }
            paintHeader();
            paintChips();
            paintMenu();
            show('menu');

            // Asked AFTER the menu paints, not before: a diner who sees a form
            // on a blank screen has no idea what they are signing up for, and
            // the menu behind the sheet is what makes the request make sense.
            customer = readSession();
            if (!customer) openWelcome();

            // Someone else at this table may have ordered already, or this is a
            // second round. Routed through refreshOrders() rather than its own
            // fetch so it takes a sequence ticket — this is the request that
            // used to overtake the post-submit refresh and blank the badge.
            // It also pre-paints the sheet, so the first tap on Pesanan shows
            // content rather than a spinner.
            refreshOrders().catch(function () { /* the badge is a nicety */ });
        })
        .catch(function (err) {
            if (err && err.message === 'busy') {
                die('Terlalu banyak permintaan', 'Tunggu sebentar lalu muat ulang halaman ini.');
            } else {
                die('Kode ini tidak aktif',
                    'Minta staf untuk memindai ulang atau memberikan kode meja yang baru.');
            }
        });

    function paintHeader() {
        $('outlet-name').textContent = menu.outlet || 'Menu';
        $('table-label').textContent = menu.table ? ('Meja ' + menu.table) : 'Meja';
        document.title = (menu.outlet || 'Pesan') + ' — FluxyOS';
    }

    // =====================================================================
    // Category rail. Categories are `items.pos_category` — a free string on the
    // item, the same taxonomy the till builds its chips from. There is no
    // category entity and this page must not invent a second one.
    // =====================================================================
    function paintChips() {
        var cats = menu.categories || [];
        var tab = function (value, label, iconBody, pressed) {
            return '<button class="chip" type="button" data-cat="' + esc(value) + '"'
                + ' aria-pressed="' + (pressed ? 'true' : 'false') + '">'
                + '<span class="cat-ico">' + svg(iconBody) + '</span>'
                + '<span class="cat-name">' + esc(label) + '</span></button>';
        };
        var html = tab('', 'Semua', categoryIcon(null), true);
        cats.forEach(function (c) { html += tab(c, c, categoryIcon(c), false); });
        $('chips').innerHTML = html;
    }

    $('chips').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        activeCategory = chip.dataset.cat || null;
        Array.prototype.forEach.call($('chips').children, function (c) {
            c.setAttribute('aria-pressed', String(c === chip));
        });
        paintMenu();
    });

    $('search').addEventListener('input', function (e) {
        searchTerm = String(e.target.value || '').trim().toLowerCase();
        paintMenu();
    });

    function visibleItems() {
        return menu.items.filter(function (i) {
            if (activeCategory && i.category !== activeCategory) return false;
            if (searchTerm && i.name.toLowerCase().indexOf(searchTerm) === -1) return false;
            return true;
        });
    }

    // How many of this item are in the cart, across every option combination —
    // the number the row's stepper shows.
    function qtyInCart(itemId) {
        return cart.reduce(function (s, l) {
            return s + (l.item_id === itemId ? l.qty : 0);
        }, 0);
    }

    function paintMenu() {
        var items = visibleItems();
        var host = $('menu');
        if (!items.length) {
            host.innerHTML = '<div class="empty">Tidak ada menu yang cocok.</div>';
            return;
        }

        var html = '';
        var lastGroup = null;
        var gridOpen = false;
        items.forEach(function (i) {
            var group = i.category || 'Lainnya';
            // Headings only make sense in the ungrouped view; inside one
            // category they would repeat the tab already selected above.
            if (!activeCategory && group !== lastGroup) {
                if (gridOpen) { html += '</div>'; gridOpen = false; }
                html += '<div class="group-head">' + esc(group) + '</div>';
                lastGroup = group;
            }
            if (!gridOpen) { html += '<div class="grid">'; gridOpen = true; }

            var qty = qtyInCart(i.id);
            var hasOptions = (i.modifier_groups || []).length > 0;

            html += '<article class="card" data-item="' + esc(i.id) + '" data-open="' + esc(i.id) + '">';

            // Every card gets a tile. A grid where only some cells carry an
            // image collapses into a ragged mess — worse than in a list, where
            // at least the text still lines up.
            if (i.has_image) {
                html += '<div class="card-media"><img loading="lazy" decoding="async" alt="" src="'
                    + FN + 'qr-menu-image?token=' + encodeURIComponent(TOKEN)
                    + '&item=' + encodeURIComponent(i.id) + '"></div>';
            } else {
                html += '<div class="card-media is-placeholder" style="--tint:'
                    + categoryTint(i.category) + '">' + PLACEHOLDER + '</div>';
            }

            html += '<div class="card-body">'
                + '<h3 class="card-name">' + esc(i.name) + '</h3>'
                + '<div class="card-price num">' + esc(money(i.price)) + '</div>'
                + (hasOptions ? '<div class="card-opts">Bisa disesuaikan</div>' : '')
                + '<div class="card-foot">';

            if (qty > 0 && !hasOptions) {
                html += stepperHtml(i.id, qty);
            } else if (qty > 0) {
                // An item with options can be in the cart several ways, so the
                // card cannot decrement one of them unambiguously. It shows the
                // count and reopens the chooser instead.
                html += '<button class="add-btn" type="button" data-open="' + esc(i.id) + '">'
                    + qty + ' • Tambah</button>';
            } else {
                html += '<button class="add-btn" type="button" data-open="' + esc(i.id) + '">Tambah</button>';
            }
            html += '</div></div></article>';
        });
        if (gridOpen) html += '</div>';
        host.innerHTML = html;

        // A photo that 404s (revoked token, deleted file) leaves the tile empty
        // rather than showing a torn-image icon.
        Array.prototype.forEach.call(host.querySelectorAll('.card-media img'), function (img) {
            img.addEventListener('error', function () { img.classList.add('failed'); });
        });
    }

    function stepperHtml(itemId, qty) {
        return '<div class="stepper">'
            + '<button type="button" data-dec="' + esc(itemId) + '" aria-label="Kurangi">−</button>'
            + '<span class="qty num">' + qty + '</span>'
            + '<button type="button" data-inc="' + esc(itemId) + '" aria-label="Tambah">+</button>'
            + '</div>';
    }

    $('menu').addEventListener('click', function (e) {
        // ORDER MATTERS. `data-open` is on the CARD, which is an ancestor of the
        // stepper — testing it first would make every "+" tap open the detail
        // sheet instead of adding one.
        var inc = e.target.closest('[data-inc]');
        if (inc) return bump(inc.dataset.inc, 1);
        var dec = e.target.closest('[data-dec]');
        if (dec) return bump(dec.dataset.dec, -1);
        var open = e.target.closest('[data-open]');
        if (open) return openDetail(open.dataset.open);
    });

    // Increment the plain (no-options) line for an item.
    function bump(itemId, delta) {
        var at = cart.findIndex(function (l) {
            return l.item_id === itemId && !l.options.length && !l.note;
        });
        if (at === -1) {
            if (delta > 0) addToCart(itemById(itemId), [], '', 1);
        } else {
            cart[at].qty += delta;
            if (cart[at].qty <= 0) cart.splice(at, 1);
        }
        paintMenu();
        paintCart();
    }

    function itemById(id) {
        return menu.items.filter(function (i) { return i.id === id; })[0] || null;
    }

    // =====================================================================
    // Item detail sheet
    // =====================================================================
    function openDetail(itemId) {
        var item = itemById(itemId);
        if (!item) return;

        // No modifiers and nothing to say: adding is one tap, not a sheet.
        if (!(item.modifier_groups || []).length) {
            addToCart(item, [], '', 1);
            paintMenu();
            paintCart();
            return;
        }

        detail = { item: item, chosen: {}, note: '' };
        $('item-title').textContent = item.name;
        $('item-price').textContent = money(item.price);

        var html = '';
        if (item.has_image) {
            html += '<div class="detail-hero"><img alt="" src="'
                + FN + 'qr-menu-image?token=' + encodeURIComponent(TOKEN)
                + '&item=' + encodeURIComponent(item.id) + '"></div>';
        } else {
            html += '<div class="detail-hero is-placeholder" style="--tint:'
                + categoryTint(item.category) + '">' + PLACEHOLDER + '</div>';
        }

        item.modifier_groups.forEach(function (g) {
            var required = g.select === 'one_required';
            var multi = g.select === 'many';
            html += '<div class="optgroup" data-group="' + esc(g.id) + '" data-select="' + esc(g.select) + '">'
                + '<div class="optgroup-head">'
                + '<span class="optgroup-name">' + esc(g.name) + '</span>'
                + '<span class="optgroup-rule' + (required ? '' : ' optional') + '">'
                + (required ? 'Wajib pilih 1' : (multi ? 'Pilih beberapa' : 'Opsional')) + '</span>'
                + '</div>';
            g.options.forEach(function (o) {
                html += '<label class="opt">'
                    + '<input type="' + (multi ? 'checkbox' : 'radio') + '"'
                    + ' name="g_' + esc(g.id) + '" value="' + esc(o.id) + '">'
                    + '<span class="opt-name">' + esc(o.name) + '</span>'
                    + (o.price_delta
                        ? '<span class="opt-delta num">+' + esc(money(o.price_delta)) + '</span>'
                        : '')
                    + '</label>';
            });
            html += '</div>';
        });

        html += '<div class="optgroup"><div class="optgroup-head">'
            + '<span class="optgroup-name">Catatan</span>'
            + '<span class="optgroup-rule optional">Opsional</span></div>'
            + '<textarea class="note-input" id="item-note" maxlength="120" rows="2"'
            + ' placeholder="Contoh: tidak pedas"></textarea></div>';

        $('item-body').innerHTML = html;
        $('item-body').addEventListener('change', onDetailChange);
        $('item-body').addEventListener('input', onDetailChange);
        refreshDetailTotal();
        openSheet('sheet-item');
    }

    function onDetailChange() {
        if (!detail) return;
        detail.chosen = {};
        Array.prototype.forEach.call(
            $('item-body').querySelectorAll('input:checked'),
            function (input) {
                var group = input.closest('.optgroup').dataset.group;
                (detail.chosen[group] = detail.chosen[group] || []).push(input.value);
            }
        );
        var note = $('item-note');
        detail.note = note ? String(note.value || '').trim() : '';
        refreshDetailTotal();
    }

    function chosenOptions() {
        if (!detail) return [];
        var out = [];
        Object.keys(detail.chosen).forEach(function (g) {
            detail.chosen[g].forEach(function (id) { out.push(id); });
        });
        return out;
    }

    function optionsMeta(item, optionIds) {
        var set = {};
        optionIds.forEach(function (id) { set[id] = true; });
        var meta = [];
        (item.modifier_groups || []).forEach(function (g) {
            g.options.forEach(function (o) {
                if (set[o.id]) meta.push({ id: o.id, name: o.name, price_delta: o.price_delta });
            });
        });
        return meta;
    }

    /**
     * Write to the DOM only when the value actually changed.
     *
     * NOT a micro-optimisation — it fixes a WebKit-only bug that cost a
     * reproduction to find. Typing in the note textarea and then tapping
     * "Tambah" did nothing on Safari: the tap blurs the textarea, the blur
     * fires `change`, `change` re-ran this function, and mutating the button's
     * contents between mousedown and mouseup made WebKit drop the click
     * entirely. The diner taps, nothing happens, and they tap again.
     *
     * Chromium dispatches the click regardless, so this is invisible in a
     * Chromium-only pass — which is exactly why `customer-ordering.spec.js`
     * also runs on WebKit, and why the note is typed there before the tap.
     */
    function setText(el, value) {
        if (el && el.textContent !== value) el.textContent = value;
    }
    function setDisabled(el, value) {
        if (el && el.disabled !== value) el.disabled = value;
    }

    function refreshDetailTotal() {
        if (!detail) return;
        var meta = optionsMeta(detail.item, chosenOptions());
        var delta = meta.reduce(function (s, o) { return s + o.price_delta; }, 0);
        setText($('item-add-total'), money(detail.item.price + delta));

        // A required group with nothing chosen blocks the add — the same rule
        // the till applies, enforced here so the kitchen never receives a
        // half-specified line.
        var missing = (detail.item.modifier_groups || []).some(function (g) {
            return g.select === 'one_required' && !(detail.chosen[g.id] || []).length;
        });
        setDisabled($('item-add'), missing);
    }

    $('item-add').addEventListener('click', function () {
        if (!detail || $('item-add').disabled) return;
        addToCart(detail.item, chosenOptions(), detail.note, 1);
        closeSheets();
        paintMenu();
        paintCart();
    });

    // =====================================================================
    // Cart
    //
    // The cart holds ITEM AND OPTION IDS with a display price, never a price
    // the server will trust. `qr-order` re-reads every amount from the menu;
    // these numbers exist so the customer sees a total before they commit.
    // =====================================================================
    function cartKey(itemId, optionIds, note) {
        return [itemId, optionIds.slice().sort().join(','), note || ''].join('|');
    }

    function addToCart(item, optionIds, note, qty) {
        if (!item) return;
        var meta = optionsMeta(item, optionIds);
        var key = cartKey(item.id, optionIds, note);
        var line = cart.filter(function (l) { return l.key === key; })[0];
        if (line) {
            line.qty += qty;
            return;
        }
        cart.push({
            key: key,
            item_id: item.id,
            name: item.name,
            unit_price: item.price,
            options: optionIds,
            optionNames: meta.map(function (o) { return o.name; }),
            modAmount: meta.reduce(function (s, o) { return s + o.price_delta; }, 0),
            note: note || '',
            qty: qty
        });
    }

    function cartCount() {
        return cart.reduce(function (s, l) { return s + l.qty; }, 0);
    }
    function cartTotal() {
        return cart.reduce(function (s, l) { return s + l.qty * (l.unit_price + l.modAmount); }, 0);
    }

    var cartNote = '';

    function paintCart() {
        // Read back before the repaint wipes the field. A "+" tap re-renders
        // this whole sheet, and losing what someone typed mid-sentence is the
        // kind of thing nobody reports and everybody notices.
        var noteEl = $('cart-note');
        if (noteEl) cartNote = String(noteEl.value || '');

        var count = cartCount();
        var total = cartTotal();
        setText($('cart-count'), String(count));
        setText($('cart-total'), money(total));
        $('cartbar').classList.toggle('is-open', count > 0);

        setText($('cart-sub'), menu && menu.table ? ('Meja ' + menu.table) : '');
        // Same guard as the detail sheet, for the same reason: this is a span
        // inside a button, and the button is tapped right after typing a name.
        setText($('cart-submit-total'), money(total));
        setDisabled($('cart-submit'), count === 0 || submitting);

        if (!count) {
            $('cart-body').innerHTML = '<div class="empty">Belum ada pesanan.</div>';
            return;
        }

        var html = '';
        cart.forEach(function (l, idx) {
            var meta = [];
            if (l.optionNames.length) meta.push(l.optionNames.join(', '));
            if (l.note) meta.push('“' + l.note + '”');
            html += '<div class="cartline">'
                + '<div class="cartline-body">'
                + '<div class="cartline-name">' + esc(l.name) + '</div>'
                + (meta.length ? '<div class="cartline-meta">' + esc(meta.join(' • ')) + '</div>' : '')
                + '<div style="margin-top:8px">' + cartStepper(idx, l.qty) + '</div>'
                + '</div>'
                + '<div class="cartline-price num">'
                + esc(money(l.qty * (l.unit_price + l.modAmount))) + '</div>'
                + '</div>';
        });

        html += '<div class="totals">'
            + '<div class="line grand"><span>Total</span>'
            + '<span class="num">' + esc(money(total)) + '</span></div>'
            + '</div>';

        // Identity is captured once by the gate before the first order, so this
        // sheet no longer asks for it — it just shows who the order is going
        // out under, which is the part worth confirming before committing.
        if (customer) {
            html += '<div class="cart-who">'
                + '<span>Pesanan atas nama</span>'
                + '<strong>' + esc(customer.name) + '</strong>'
                + (customer.phone ? '<span class="num">' + esc(customer.phone) + '</span>' : '')
                + '</div>';
        }
        // An order-level request. Line notes already exist ("tidak pedas" on one
        // dish); this is the one that applies to the whole ticket.
        html += '<div class="field" style="margin-top:16px">'
            + '<label for="cart-note">Catatan untuk dapur <span class="hint">— opsional</span></label>'
            + '<textarea id="cart-note" class="note-input" maxlength="200" rows="2"'
            + ' placeholder="Contoh: sendok garpu 2, jangan pakai es">'
            + esc(cartNote) + '</textarea></div>';
        html += '<div id="cart-notice"></div>';

        $('cart-body').innerHTML = html;
    }

    function cartStepper(idx, qty) {
        return '<div class="stepper">'
            + '<button type="button" data-cdec="' + idx + '" aria-label="Kurangi">−</button>'
            + '<span class="qty num">' + qty + '</span>'
            + '<button type="button" data-cinc="' + idx + '" aria-label="Tambah">+</button>'
            + '</div>';
    }

    $('cart-body').addEventListener('click', function (e) {
        var inc = e.target.closest('[data-cinc]');
        var dec = e.target.closest('[data-cdec]');
        if (!inc && !dec) return;
        var idx = Number((inc || dec).dataset.cinc || (inc || dec).dataset.cdec);
        if (!cart[idx]) return;
        cart[idx].qty += inc ? 1 : -1;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        paintCart();
        paintMenu();
        if (!cart.length) closeSheets();
    });

    // =====================================================================
    // Sheets
    // =====================================================================
    function openSheet(id) {
        $('scrim').classList.add('is-open');
        $(id).classList.add('is-open');
        // The page behind a sheet must not scroll under the customer's finger.
        document.body.style.overflow = 'hidden';
    }
    function closeSheets(opts) {
        // The identity gate closes only when it has been completed. Every other
        // path — scrim, Escape, the close button — leaves it up.
        if (welcomeOpen() && !(opts && opts.force)) return;
        $('scrim').classList.remove('is-open');
        $('sheet-item').classList.remove('is-open');
        $('sheet-cart').classList.remove('is-open');
        $('sheet-welcome').classList.remove('is-open');
        $('sheet-orders').classList.remove('is-open');
        document.body.style.overflow = '';
        detail = null;
        setActiveTab('menu');
    }
    $('scrim').addEventListener('click', function () { closeSheets(); });
    $('welcome-go').addEventListener('click', submitWelcome);
    // Enter on either field submits, the way a one-question form should.
    ['welcome-name', 'welcome-phone'].forEach(function (id) {
        $(id).addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); submitWelcome(); }
        });
        $(id).addEventListener('input', function () { $(id).classList.remove('invalid'); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
        b.addEventListener('click', function () { closeSheets(); });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSheets();
    });

    $('cart-open').addEventListener('click', function () {
        paintCart();
        openSheet('sheet-cart');
    });

    // ── Floating tab bar ──────────────────────────────────────────────────
    //
    // Two destinations. "Keranjang" used to sit here and opened the same sheet
    // the floating cart bar opens — one action behind two controls, which made
    // the prominent one compete with itself. The cart bar is the primary now.
    document.querySelector('.tabbar').addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab || welcomeOpen()) return;
        if (tab.dataset.tab === 'menu') {
            closeSheets();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setActiveTab('menu');
        } else {
            openOrders();
        }
    });

    /**
     * Measure the tab bar and publish its real footprint.
     *
     * The cart bar and the page's bottom spacer both position against
     * `--tabbar-space`, and a hard-coded guess is wrong the moment the bar is
     * restyled — a padding change put the cart bar 6px on top of it, which no
     * static value would have caught. Measuring makes the overlap impossible
     * rather than merely currently-absent.
     */
    function syncTabbarSpace() {
        var el = document.querySelector('.tabbar-inner');
        if (!el) return;
        var h = Math.ceil(el.getBoundingClientRect().height);
        if (!h) return;
        // The bar's own 10px offset from the bottom edge, plus the safe area,
        // are already outside the measured box.
        document.documentElement.style.setProperty(
            '--tabbar-space', 'calc(' + (h + 10) + 'px + var(--safe-bottom))');
    }
    syncTabbarSpace();
    window.addEventListener('resize', syncTabbarSpace);
    // Web fonts land after first paint and change the label height with them.
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncTabbarSpace).catch(function () {});
    }

    function setActiveTab(which) {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
            t.setAttribute('aria-current', String(t.dataset.tab === which));
        });
    }

    // ── Order status ──────────────────────────────────────────────────────
    //
    // Read from the server every time it is opened, never from what this phone
    // remembers. A remembered list cannot know that a cashier voided a line or
    // that the kitchen marked the ticket ready, and it would state both
    // confidently. It is the TABLE's order — a QR order appends to the one open
    // document, so four people sharing a bill see the same thing, which is the
    // correct answer for a shared bill.
    function openOrders() {
        setActiveTab('orders');
        $('orders-sub').textContent = menu && menu.table ? ('Meja ' + menu.table) : '';
        $('orders-body').innerHTML = '<p class="orders-loading">Memuat pesanan…</p>';
        openSheet('sheet-orders');
        refreshOrders();
    }

    // Three things fetch this: the boot badge, opening the sheet, and the
    // refresh after placing an order. They can be in flight together, and
    // fetch gives no ordering guarantee — so a STALE response can land last and
    // overwrite a newer one. That is not hypothetical: the boot fetch (taken
    // before any order existed, so `has_order: false`) landed after the
    // post-submit refresh and blanked both the sheet and the badge, seconds
    // after the diner had watched their order go through.
    //
    // Each request takes a ticket; only the newest one is allowed to paint.
    var ordersSeq = 0;

    function refreshOrders() {
        var seq = ++ordersSeq;
        return fetch(FN + 'qr-order-status?token=' + encodeURIComponent(TOKEN))
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
                if (seq !== ordersSeq) return;      // a newer request has overtaken this one
                if (!data) throw new Error('gone');
                paintOrders(data);
                paintOrdersBadge(data);
            })
            .catch(function () {
                if (seq !== ordersSeq) return;
                $('orders-body').innerHTML =
                    '<p class="orders-loading">Tidak bisa memuat pesanan. Coba lagi sebentar.</p>';
            });
    }

    var STAGES = ['Diterima', 'Disiapkan', 'Siap', 'Diantar'];

    function paintOrders(d) {
        if (!d.has_order || !(d.lines || []).length) {
            $('orders-body').innerHTML = '<div class="empty">Belum ada pesanan di meja ini.</div>';
            return;
        }

        // Where the ticket is, as four steps. The till's own ladder has seven
        // and uses words a diner has no reason to know.
        var step = Math.min(4, Math.max(1, Number(d.stage) || 1));
        var track = '<div class="track">' + STAGES.map(function (label, i) {
            var n = i + 1;
            return '<div class="track-step' + (n <= step ? ' done' : '') + '">'
                + '<span class="track-dot"></span><span>' + esc(label) + '</span></div>';
        }).join('') + '</div>';

        var lines = (d.lines || []).map(function (l) {
            var meta = [];
            if (l.modifiers && l.modifiers.length) meta.push(l.modifiers.join(', '));
            if (l.note) meta.push('“' + l.note + '”');
            return '<div class="cartline">'
                + '<div class="cartline-body">'
                + '<div class="cartline-name"><span class="num">' + l.quantity + '×</span> '
                + esc(l.item_name) + '</div>'
                + (meta.length ? '<div class="cartline-meta">' + esc(meta.join(' • ')) + '</div>' : '')
                + '</div>'
                + '<div class="cartline-price num">' + esc(money(l.gross_amount)) + '</div>'
                + '</div>';
        }).join('');

        var rows = '';
        if (d.discount_total) rows += totalRow('Diskon', -d.discount_total);
        if (d.service_charge_amount) rows += totalRow('Layanan', d.service_charge_amount);
        if (d.tax_amount) rows += totalRow('Pajak', d.tax_amount);

        $('orders-body').innerHTML =
            '<div class="orders-head">'
            + '<span class="orders-no num">' + esc(d.order_number || '') + '</span>'
            + '<span class="orders-stage">' + esc(d.stage_label || '') + '</span>'
            + '</div>'
            + track
            + lines
            + (d.note ? '<div class="notice">Catatan: ' + esc(d.note) + '</div>' : '')
            + '<div class="totals">' + rows
            + '<div class="line grand"><span>Total</span><span class="num">'
            + esc(money(d.total_amount)) + '</span></div></div>'
            + '<p class="orders-loading">Tagihan dibayar di kasir. Panggil staf kalau sudah selesai.</p>';
    }

    function totalRow(label, amount) {
        return '<div class="line"><span>' + esc(label) + '</span>'
            + '<span class="num">' + esc(money(amount)) + '</span></div>';
    }

    function paintOrdersBadge(d) {
        var n = d && d.has_order
            ? (d.lines || []).reduce(function (s, l) { return s + (Number(l.quantity) || 0); }, 0)
            : 0;
        var badge = $('tab-orders-badge');
        badge.textContent = String(n);
        badge.classList.toggle('on', n > 0);
    }

    // A lightweight toast, because two of the four tabs answer with words.
    // A lightweight toast, because two of the four tabs answer with words.
    var toastTimer = null;
    function toast(msg) {
        var el = $('toast');
        el.textContent = msg;
        el.classList.add('is-open');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('is-open'); }, 2600);
    }

    // =====================================================================
    // Submit
    // =====================================================================
    $('cart-submit').addEventListener('click', function () {
        if (submitting || !cart.length) return;
        submitting = true;
        var btn = $('cart-submit');
        btn.disabled = true;
        // A SPINNER, not just a word swap. The request can take a couple of
        // seconds on restaurant wifi, and a button that only changes its label
        // reads as stuck — which is how a diner ends up tapping again. The
        // idempotency ref makes a double tap harmless, but this is what stops
        // it happening.
        btn.classList.add('is-busy');
        btn.querySelector('span').textContent = 'Mengirim pesanan…';

        fetch(FN + 'qr-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: TOKEN,
                client_ref: clientRef,
                customer_name: customer ? customer.name : '',
                customer_phone: customer ? customer.phone : '',
                note: cartNote,
                lines: cart.map(function (l) {
                    return {
                        item_id: l.item_id,
                        quantity: l.qty,
                        options: l.options,
                        note: l.note
                    };
                })
            })
        })
            .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
            .then(function (res) {
                if (!res.ok || !res.body.ok) throw res.body || {};
                $('done-number').textContent = res.body.order_number || '';
                $('done-sub').textContent = res.body.rejected_lines
                    ? 'Beberapa item sudah tidak tersedia dan tidak dimasukkan.'
                    : 'Dapur sudah menerima pesanan Anda.';
                cart = [];
                cartNote = '';
                // A new ref for the next order, or a second round would be
                // deduplicated against the first and silently do nothing.
                clientRef = newRef();
                // The Pesanan badge is now wrong by exactly what was just sent.
                refreshOrders().catch(function () {});
                closeSheets();
                paintCart();
                paintMenu();
                show('done');
            })
            .catch(function (err) {
                var msg = 'Gagal mengirim pesanan. Coba lagi.';
                if (err && err.error === 'order_closed') {
                    msg = 'Tagihan meja ini baru saja ditutup. Panggil staf untuk membuka pesanan baru.';
                } else if (err && err.error === 'nothing_orderable') {
                    msg = 'Item yang Anda pilih sudah tidak tersedia.';
                }
                var host = $('cart-notice');
                if (host) host.innerHTML = '<div class="notice bad">' + esc(msg) + '</div>';
            })
            .then(function () {
                submitting = false;
                btn.classList.remove('is-busy');
                btn.querySelector('span').textContent = 'Order Sekarang';
                btn.disabled = cart.length === 0;
            });
    });

    $('done-more').addEventListener('click', function () { show('menu'); });
})();
</script>
</body>
</html>
