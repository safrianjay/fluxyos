<!DOCTYPE html>
<html lang="en" class="fluxy-booting">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxyOS | Point of Sale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-dashboard.css">
    <link rel="stylesheet" href="assets/css/accounting.css">
    <style>
        /* ── The till is a MOBILE surface first ──────────────────────────────
           Every other app page is a desktop finance screen that also works on a
           phone. This one is the reverse: it is used standing up, one-handed,
           on a phone or a small tablet. So the layout is designed at 375px and
           widens, and every tap target is >= 44px.

           Everything here reuses the shared type scale and the semantic status
           colours already in shared-dashboard.css. No new visual language. */

        .pos-shell { display: grid; gap: 16px; grid-template-columns: 1fr; }
        /* Side-by-side is decided by the space actually AVAILABLE, not by the
           viewport — because the 220px sidebar is what really governs it.
           Measuring the viewport, a 10" tablet in portrait (834pt) looks wide
           enough and is not: 834 − 220 sidebar − 48 padding − 320 panel leaves
           the catalogue 202px, about 90px per card. A container query asks the
           canvas instead, so the sidebar is counted automatically.
           It also means this starts working on a portrait tablet the moment the
           cashier shell drops the sidebar (Phase 3) — no breakpoint to revisit. */
        /* Both containers are NAMED. Unnamed, the orders grid below resolved
           against the canvas — which is ~1160px wide while the board column it
           actually lives in is ~727px, because the order panel takes the rest.
           The board drew three columns into two columns' worth of space and every
           card header truncated. */
        .fluxy-page-canvas { container-type: inline-size; container-name: poscanvas; }
        @container poscanvas (min-width: 720px) {
            .pos-shell { grid-template-columns: minmax(0,1fr) 320px; align-items: start; }
        }
        @container poscanvas (min-width: 1040px) {
            .pos-shell { grid-template-columns: minmax(0,1fr) 380px; }
        }
        /* Viewport fallback for engines without container queries. */
        @supports not (container-type: inline-size) {
            @media (min-width: 1024px) { .pos-shell { grid-template-columns: minmax(0,1fr) 380px; align-items: start; } }
        }

        /* ── Outlet bar ─────────────────────────────────────────────────── */
        .pos-outletbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 14px; background: #fff; border: 1px solid #E2E8F0;
            border-radius: 12px;
        }
        .pos-outletbar label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: #64748B;
        }
        /* fluxy-select.js wraps the native control in a block-level element that
           takes the whole flex row unless it is pinned. Left alone the outlet
           picker stretched to ~1500px for a two-word value. */
        .pos-outletbar .fluxy-select { flex: 0 1 260px; min-width: 180px; }

        /* ── Shift bar ──────────────────────────────────────────────────── */
        .pos-shiftbar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 12px 14px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
        }
        .pos-shiftbar.is-closed { border-style: dashed; background: #F8FAFC; }
        .pos-shift-state {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 13px; font-weight: 600; color: #0F172A;
        }
        /* A dot plus a word. The dot alone would be colour-only status. */
        .pos-shift-dot { width: 8px; height: 8px; border-radius: 50%; background: #CBD5E1; flex-shrink: 0; }
        .pos-shiftbar.is-open .pos-shift-dot { background: #16A34A; }
        .pos-shift-meta { font-size: 12px; color: #64748B; font-variant-numeric: tabular-nums; }
        .pos-shift-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .pos-shift-btn {
            min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; border: 1px solid #E2E8F0;
            background: #fff; color: #334155;
        }
        .pos-shift-btn:hover { background: #F8FAFC; }
        .pos-shift-btn.is-primary { background: #0F172A; color: #fff; border-color: #0F172A; }
        .pos-shift-btn.is-primary:hover { background: #1E293B; }

        /* Blind close: the count goes in before the expectation comes out. */
        .pos-count-reveal { border-top: 1px solid #E2E8F0; margin-top: 16px; padding-top: 16px; }
        .pos-variance {
            display: flex; align-items: baseline; justify-content: space-between;
            font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
            padding: 10px 12px; border-radius: 8px; margin-top: 10px;
        }
        .pos-variance.is-ok    { background: #E8F3EC; color: #15803D; }
        .pos-variance.is-short { background: #FBECEC; color: #B91C1C; }
        .pos-variance.is-over  { background: #FBF3E2; color: #A16207; }

        /* ── Metric strip ───────────────────────────────────────────────── */
        .pos-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #E2E8F0; border: 1px solid #E2E8F0; border-radius: 12px; overflow: hidden; }
        @media (min-width: 640px) { .pos-metrics { grid-template-columns: repeat(4, 1fr); } }
        .pos-metric { background: #fff; padding: 14px 16px; }
        /* On a phone the four metrics push the catalogue most of a screen down.
           They stay (they carry the unposted + no-cost-basis honesty signals)
           but give up ~50px of chrome for it. */
        @media (max-width: 640px) {
            .pos-metric { padding: 10px 12px; }
            .pos-metric-value { font-size: 17px; }
            .pos-metric-label { margin-top: 5px; }
        }
        .pos-metric-value {
            font-size: 20px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; color: #0B0F19;
        }
        .pos-metric-label {
            margin-top: 8px; font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: #64748B;
        }
        /* Semantic only — a hue with no meaning is the one thing worth leaving out. */
        .pos-metric-value.is-warn { color: #EA580C; }

        /* ── Order panel ────────────────────────────────────────────────── */
        .pos-order { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { .pos-order { position: sticky; top: 16px; max-height: calc(100vh - 140px); } }
        .pos-order-head { padding: 14px 16px; border-bottom: 1px solid #E2E8F0; }
        .pos-order-lines { flex: 1; overflow-y: auto; min-height: 120px; max-height: 44vh; }
        /* With no order open there is nothing to scroll, and reserving the
           minimum left a dead gap between the heading and the only action. */
        .pos-order.is-empty .pos-order-lines { min-height: 0; }
        .pos-order.is-empty .pos-order-foot { border-top: 0; background: #fff; }
        .pos-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #F1F5F9; }
        .pos-line-name { font-size: 14px; font-weight: 500; color: #0F172A; }
        .pos-line-meta { font-size: 12px; color: #64748B; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .pos-line-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #0F172A; text-align: right; white-space: nowrap; }
        .pos-line-strike { text-decoration: line-through; color: #94A3B8; font-weight: 400; font-size: 12px; display: block; }
        .pos-qty { display: inline-flex; align-items: center; gap: 2px; margin-top: 6px; }
        .pos-qty button {
            width: 30px; height: 30px; border: 1px solid #E2E8F0; background: #fff; border-radius: 6px;
            font-size: 14px; line-height: 1; color: #475569; cursor: pointer;
        }
        .pos-qty button:hover { background: #F8FAFC; }
        .pos-qty span { min-width: 30px; text-align: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        /* Note and discount sit apart from the +/- pair: they are occasional,
           and adjacent same-weight buttons is how the wrong one gets pressed
           on a phone mid-service. */
        .pos-qty-alt { margin-left: 6px; color: #94A3B8; font-size: 12px; }
        .pos-qty-alt:hover { color: #0F172A; }
        .pos-order-foot { padding: 14px 16px; border-top: 1px solid #E2E8F0; background: #F8FAFC; border-radius: 0 0 12px 12px; }
        .pos-total-row { display: flex; justify-content: space-between; font-size: 13px; color: #475569; padding: 3px 0; font-variant-numeric: tabular-nums; }
        .pos-total-row.is-grand { font-size: 16px; font-weight: 600; color: #0B0F19; padding-top: 8px; margin-top: 6px; border-top: 1px solid #E2E8F0; }
        .pos-total-row.is-discount { color: #C2410C; }

        /* One primary action per zone. The label changes with status; there is
           never a second button at the same weight beside it. */
        .pos-primary {
            width: 100%; min-height: 48px; margin-top: 12px; border-radius: 10px;
            background: #0F172A; color: #fff; font-size: 15px; font-weight: 600;
            border: none; cursor: pointer; transition: background 120ms ease;
        }
        .pos-primary:hover:not(:disabled) { background: #1E293B; }
        .pos-primary:disabled { opacity: .45; cursor: not-allowed; }
        .pos-secondary {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
            background: none; border: none; padding: 6px 0; cursor: pointer;
            font-size: 12px; font-weight: 500; color: #64748B;
        }
        .pos-secondary:hover { color: #B91C1C; }

        /* ── Menu ───────────────────────────────────────────────────────── */
        .pos-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .pos-menu-item {
            min-height: 76px; padding: 12px; background: #fff; border: 1px solid #E2E8F0;
            border-radius: 10px; text-align: left; cursor: pointer;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .pos-menu-item:hover { border-color: #CBD5E1; background: #F8FAFC; }
        .pos-menu-item:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-menu-item:disabled { opacity: .5; cursor: not-allowed; }
        .pos-menu-name { font-size: 13px; font-weight: 500; color: #0F172A; line-height: 1.3; }
        .pos-menu-price { font-size: 13px; font-weight: 600; color: #475569; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .pos-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #94A3B8; margin: 14px 0 8px; }
        .pos-cat:first-child { margin-top: 0; }

        /* ── Paid today ─────────────────────────────────────────────────── */
        .pos-paid-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 100%; min-height: 44px; padding: 8px 10px; border: 0; background: none;
            border-bottom: 1px solid #F1F5F9; cursor: pointer; text-align: left;
        }
        .pos-paid-row:last-child { border-bottom: 0; }
        .pos-paid-row:hover { background: #F8FAFC; }
        .pos-paid-label { font-size: 14px; font-weight: 500; color: #0F172A; display: block; }
        .pos-paid-meta { font-size: 12px; color: #94A3B8; display: block; margin-top: 2px; }
        .pos-paid-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #0F172A; white-space: nowrap; }
        .pos-paid-amt.is-void { text-decoration: line-through; color: #94A3B8; }

        /* ── Payment ────────────────────────────────────────────────────── */
        .pos-methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
        .pos-method {
            min-height: 44px; border: 1px solid #E2E8F0; background: #fff; border-radius: 8px;
            font-size: 13px; font-weight: 500; color: #334155; cursor: pointer;
        }
        .pos-method.is-on { border-color: #0F172A; background: #0F172A; color: #fff; }
        .pos-amount-input {
            width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px;
            font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
            text-align: right; color: #0B0F19;
        }
        .pos-amount-input:focus { outline: 2px solid #EA580C; outline-offset: -1px; border-color: transparent; }

        /* ── Honesty banners ────────────────────────────────────────────── */
        .pos-note {
            display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; line-height: 1.45; border: 1px solid;
        }
        .pos-note svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
        .pos-note.is-warn { background: #FFF7ED; border-color: #FED7AA; color: #9A3412; }
        .pos-note.is-info { background: #F8FAFC; border-color: #E2E8F0; color: #475569; }
        .pos-note a { font-weight: 600; text-decoration: underline; color: inherit; }

        .pos-offline {
            display: none; align-items: center; gap: 8px; padding: 10px 14px;
            background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
            border-radius: 10px; font-size: 13px; font-weight: 500;
        }
        body.is-offline .pos-offline { display: flex; }

        @media (max-width: 640px) {
            .pos-tables { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
            .pos-menu-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }

        /* ══ Reference-aligned catalogue (RestroBit layout, FluxyOS tokens) ══
           Same information architecture as the reference — search, category
           chips, a 4-up product grid, and a right-hand order panel — built from
           the shared scale and the semantic colours already in
           shared-dashboard.css. No new visual language, and no orange fills:
           orange is an accent here as it is everywhere else in the product. */

        .pos-catalog-toolbar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 14px 16px; border-bottom: 1px solid #E2E8F0;
        }
        .pos-catalog-count {
            margin-left: auto; font-size: 12px; color: #64748B;
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }

        /* Search: one shape, two sizes. The reference uses a leading magnifier
           on both the product search and the order search. */
        .pos-search { position: relative; flex: 1 1 240px; min-width: 180px; }
        .pos-search svg {
            position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; color: #94A3B8; pointer-events: none;
        }
        .pos-search input {
            width: 100%; min-height: 40px; padding: 0 12px 0 34px;
            border: 1px solid #E2E8F0; border-radius: 10px; background: #fff;
            font-size: 14px; color: #0F172A; outline: none;
        }
        .pos-search input::placeholder { color: #94A3B8; }
        .pos-search input:focus { border-color: #CBD5E1; box-shadow: 0 0 0 3px rgba(15,23,42,.05); }
        .pos-search-sm { flex: 1 1 auto; }
        .pos-search-sm input { min-height: 36px; font-size: 13px; }

        /* Category chips. The reference fills the active chip orange; orange
           backgrounds are prohibited project-wide (CLAUDE.md), so the active
           state is the same dark navy every primary control uses. */
        .pos-chips {
            display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
            border-bottom: 1px solid #E2E8F0; scrollbar-width: thin;
        }
        .pos-chip {
            flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 999px;
            border: 1px solid #E2E8F0; background: #fff; color: #475569;
            font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
            transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        .pos-chip:hover { background: #F8FAFC; border-color: #CBD5E1; }
        .pos-chip:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-chip.is-active { background: #0F172A; border-color: #0F172A; color: #fff; }

        .pos-catalog-body { padding: 18px; }

        /* ══ VERTICAL RHYTHM — the bug this fixes ═════════════════════════
           `.fluxy-section-stack > * + *` only spaces DIRECT children. Wrapping
           the page's sections in `.pos-view` therefore moved them one level
           down and they lost their 24px entirely, so the shift bar, the metric
           strip and the catalogue butted straight into each other. It read as
           "tight, odd spacing" and was actually zero.
           The stack is re-established at the level the sections now live at,
           and every gap on the page is one of these three values. */
        .pos-view > * + *   { margin-top: 20px; }
        .pos-col > * + *    { margin-top: 20px; }
        .pos-shell          { gap: 20px; }
        .pos-view section + section { margin-top: 20px; }
        .pos-pagehead       { margin-bottom: 2px; }

        /* The shared column: views switch here, the order panel stays put. */
        .pos-col { min-width: 0; container-type: inline-size; container-name: posboard; }
        .pos-shell-left { min-width: 0; }
        /* Orders and Shift have no order to show, so they take the full width
           rather than leaving a 380px column of empty panel beside them. */
        .pos-shell.is-wide { grid-template-columns: minmax(0, 1fr); }
        .pos-shell.is-wide .pos-order { display: none; }

        /* Product grid. 4-up on desktop like the reference, stepping down to 2
           on a phone — the till is used one-handed and a 3rd column at 375px
           puts the price below the fold of the card. */
        .pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
        @media (min-width: 640px)  { .pos-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        @media (min-width: 1280px) { .pos-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }

        .pos-card {
            position: relative; display: flex; flex-direction: column; text-align: left;
            background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
            padding: 10px; cursor: pointer; min-height: 44px;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .pos-card:hover:not(:disabled) { border-color: #CBD5E1; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
        .pos-card:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-card:disabled { opacity: .55; cursor: not-allowed; }

        /* THE IMAGE SLOT. `items` has no image field yet (docs/data-model/items.md),
           and the brief is explicit: do not invent placeholder imagery. So the
           slot is real and reserved, filled for now by the item's own initials on
           a neutral tile. When items gain an image, an <img> drops in here and
           nothing around it moves. */
        .pos-card-media {
            height: 64px; border-radius: 8px; background: #F1F5F9;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 8px; flex-shrink: 0;
        }
        /* 64px, not the reference's 4:3, WHILE THERE IS NO IMAGE. The reference's
           cards are image-led and its photos carry meaning; an empty 4:3 tile
           carries none and cost two thirds of the card, cutting the catalogue to
           four items above the fold. The slot stays — the brief requires the page
           to be ready for item images — it is just not reserving a photo's worth
           of space for an initial.
           When items gain an image field, `.pos-card.has-image .pos-card-media`
           takes the aspect ratio back and nothing else moves. */
        .pos-card.has-image .pos-card-media { height: auto; aspect-ratio: 4 / 3; }
        .pos-card-media img { width: 100%; height: 100%; object-fit: cover; }
        .pos-card-initial {
            font-size: 20px; font-weight: 600; color: #94A3B8; letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .pos-card-name {
            font-size: 14px; font-weight: 500; color: #0F172A; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pos-card-price {
            margin-top: 6px; font-size: 14px; font-weight: 600; color: #C2410C;
            font-variant-numeric: tabular-nums;
        }
        .pos-card-add {
            position: absolute; right: 10px; bottom: 10px; width: 28px; height: 28px;
            border-radius: 999px; border: 0; background: #0F172A; color: #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 16px; line-height: 1; cursor: pointer;
        }
        .pos-card:hover .pos-card-add,
        .pos-card:focus-within .pos-card-add { display: flex; }
        /* Touch has no hover: on a tablet the affordance must always be visible. */
        @media (hover: none) { .pos-card-add { display: flex; } }
        .pos-card-warn { font-size: 12px; color: #A16207; margin-top: 4px; }

        /* ── Order panel, reference shape ───────────────────────────────── */
        .pos-order-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .pos-order-selects select {
            width: 100%; min-height: 36px; padding: 0 10px; font-size: 13px;
            border: 1px solid #E2E8F0; border-radius: 10px; background: #fff; color: #0F172A;
        }
        .pos-order-id { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .pos-order-id-icon { width: 22px; height: 22px; color: #0F172A; flex-shrink: 0; }
        .pos-order-id-icon svg { width: 100%; height: 100%; }
        .pos-order-id h2 { font-size: 16px; font-weight: 600; color: #0B0F19; letter-spacing: -0.01em; }
        .pos-order-sub { font-size: 12px; color: #64748B; margin-top: 4px; }

        .pos-order-results {
            margin-top: 8px; border: 1px solid #E2E8F0; border-radius: 10px;
            overflow: hidden; max-height: 190px; overflow-y: auto;
        }
        .pos-order-result {
            display: flex; justify-content: space-between; gap: 8px; width: 100%;
            padding: 9px 12px; background: #fff; border: 0; border-bottom: 1px solid #F1F5F9;
            font-size: 13px; color: #0F172A; cursor: pointer; text-align: left;
        }
        .pos-order-result:last-child { border-bottom: 0; }
        .pos-order-result:hover { background: #F8FAFC; }
        .pos-order-result span:last-child { color: #64748B; font-variant-numeric: tabular-nums; }

        /* A line row, matching the reference: name, `price × qty = total`, a
           stepper, a remove control, and a notes affordance. */
        .pos-line-calc { font-size: 12px; color: #C2410C; font-variant-numeric: tabular-nums; margin-top: 2px; }
        .pos-line-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .pos-line-remove {
            width: 26px; height: 26px; border-radius: 7px; border: 1px solid #F1D5D7;
            background: #FEF2F2; color: #B91C1C; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .pos-line-remove:hover { background: #FEE2E2; }
        .pos-line-remove svg { width: 13px; height: 13px; }
        .pos-line-note-btn {
            display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
            padding: 0 9px; border-radius: 7px; border: 1px solid #E2E8F0;
            background: #fff; color: #475569; font-size: 12px; cursor: pointer;
        }
        .pos-line-note-btn:hover { background: #F8FAFC; }
        .pos-line-note-btn svg { width: 12px; height: 12px; }
        .pos-line-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        /* Totals stack. The reference's editable rows carry a pencil; here it
           opens the discount drawer that already exists. */
        .pos-total-edit {
            border: 0; background: none; color: #64748B; cursor: pointer;
            padding: 0 0 0 6px; line-height: 1;
        }
        .pos-total-edit:hover { color: #C2410C; }
        .pos-total-edit svg { width: 12px; height: 12px; }

        .pos-order-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .pos-order-actions .pos-secondary { flex: 1 1 auto; }

        /* ══ ORDERS BOARD ═════════════════════════════════════════════════
           Dense on purpose. This is a surface a cashier scans under pressure,
           so the spacing here is tighter than the rest of the app — every gap
           is 8/10/12/14, never the 20/24 the reading surfaces use. */
        .pos-orders-date { font-size: 12px; color: #64748B; white-space: nowrap; }
        .pos-orders-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
        }
        .pos-orders-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .pos-tabs { display: inline-flex; gap: 4px; background: #F1F5F9; padding: 3px; border-radius: 10px; }
        .pos-tab {
            min-height: 32px; padding: 0 14px; border: 0; border-radius: 8px;
            background: none; color: #475569; font-size: 13px; font-weight: 500; cursor: pointer;
        }
        .pos-tab:hover { color: #0F172A; }
        .pos-tab:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-tab.is-active { background: #fff; color: #0B0F19; font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,.10); }
        .pos-orders-controls { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; justify-content: flex-end; }
        .pos-orders-controls .pos-search { flex: 0 1 300px; }
        .pos-filter-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px;
            border: 1px solid #E2E8F0; background: #fff; color: #475569; cursor: pointer;
        }
        .pos-filter-btn:hover { background: #F8FAFC; }
        .pos-filter-btn.is-on { border-color: #0F172A; color: #0F172A; background: #F1F5F9; }
        .pos-filter-btn svg { width: 16px; height: 16px; }

        .pos-orders-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
        /* posboard = .pos-col, the board's own column. Three columns need real
           width: a card carries a tag, an order number, a status pill, a
           three-column item table and two buttons, and below ~300px each the
           header starts eating itself. */
        @container posboard (min-width: 620px)  { .pos-orders-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
        @container posboard (min-width: 1000px) { .pos-orders-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        @supports not (container-type: inline-size) {
            @media (min-width: 1024px) { .pos-orders-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
            @media (min-width: 1440px) { .pos-orders-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        }

        /* Cards size to their own content. Stretching them to the tallest card
           in the row put 60px of nothing between a two-line order's items and
           its total — dead space inside a bordered box reads as a bug, and the
           item cap below keeps the ragging small. */
        .pos-orders-grid { align-items: start; }
        .pos-ocard {
            display: flex; flex-direction: column; gap: 10px;
            background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
            padding: 12px; cursor: pointer;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .pos-ocard:hover { border-color: #CBD5E1; box-shadow: 0 2px 8px rgba(15,23,42,.07); }
        .pos-ocard:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-ocard.is-open { border-color: #0F172A; box-shadow: 0 0 0 1px #0F172A inset; }

        /* The header was the broken part: a long order number and a long status
           label fought for the same row, so "Order 20260831-017" wrapped into
           the badge. The middle column is now the only flexible one and it
           truncates; the badge never shrinks. */
        .pos-ocard-head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
        /* The identifier a cashier scans for. Loudest thing on the card, and the
           status badge is deliberately quieter so it cannot compete with it. */
        .pos-otag {
            flex-shrink: 0; min-width: 40px; height: 40px; padding: 0 8px;
            border-radius: 10px; background: #0F172A; color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
        }
        .pos-ocard-id { min-width: 0; flex: 1 1 auto; overflow: hidden; }
        .pos-ocard-meta {
            font-size: 12px; font-weight: 600; color: #0F172A;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* Date and status share the second line. Putting the badge on the first
           line alongside the order number squeezed both — the number truncated
           to "#018 · ..." and the badge ran into it. The number now owns a whole
           line and the badge sits beside the one thing short enough to share. */
        .pos-ocard-sub {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: 3px; min-width: 0;
        }
        .pos-ocard-when {
            font-size: 12px; color: #94A3B8; flex: 0 1 auto; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* .fluxy-status alone has no base rule — it is only the colour half of
           the pair, so the badge rendered as bare coloured text. The pill is
           .fluxy-table-status; this only makes it card-sized. */
        .pos-ocard-status { flex: 0 0 auto; font-size: 12px; padding: 3px 7px; }

        .pos-ocard-items { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        .pos-ocard-items th {
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
            color: #94A3B8; text-align: left; padding: 0 0 5px; border-bottom: 1px solid #F1F5F9;
        }
        .pos-ocard-items th:nth-child(2), .pos-ocard-items td:nth-child(2) { text-align: center; width: 40px; }
        .pos-ocard-items th:last-child, .pos-ocard-items td:last-child { text-align: right; white-space: nowrap; }
        .pos-ocard-items td { font-size: 12px; color: #334155; padding: 5px 0; }
        .pos-ocard-items td:first-child { padding-right: 8px; }
        .pos-ocard-more td { color: #94A3B8; font-size: 12px; }

        .pos-ocard-total {
            display: flex; justify-content: space-between; align-items: baseline;
            border-top: 1px solid #E2E8F0; padding-top: 8px;
            font-size: 14px; font-weight: 700; color: #0B0F19; font-variant-numeric: tabular-nums;
        }
        .pos-ocard-actions { display: flex; gap: 8px; }
        .pos-ocard-btn {
            flex: 1; min-height: 34px; border-radius: 8px; cursor: pointer;
            border: 1px solid #E2E8F0; background: #fff; color: #334155;
            font-size: 13px; font-weight: 600;
        }
        .pos-ocard-btn:hover { background: #F8FAFC; }
        .pos-ocard-btn.is-primary { background: #0F172A; border-color: #0F172A; color: #fff; }
        .pos-ocard-btn.is-primary:hover { background: #1E293B; }

        /* ── Floor plan ─────────────────────────────────────────────────
           Following the supplied reference: zone tabs, a legend, and table
           shapes that carry their own state. The reference's chair rendering is
           not reproduced — `seats` is display-only and often null, so chairs
           would be invented furniture — and neither is "Reserved", which has no
           concept behind it. A floor plan that shows a state nothing can enter
           is worse than one that is plain. */
        .pos-floor-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
        .pos-floor-tab {
            flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 8px;
            border: 1px solid #E2E8F0; background: #fff; color: #475569;
            font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
        }
        .pos-floor-tab:hover { background: #F8FAFC; }
        .pos-floor-tab:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-floor-tab.is-active { background: #0F172A; border-color: #0F172A; color: #fff; }

        .pos-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px; color: #64748B; }
        .pos-legend span { display: inline-flex; align-items: center; gap: 6px; }
        /* Rings, not fills. Orange as a BACKGROUND is prohibited project-wide
           (CLAUDE.md) and the design lint catches it — which it did here. A ring
           reads the same at 9px and keeps orange an accent. */
        .pos-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 2px solid; }
        .pos-dot.is-free { border-color: #CBD5E1; background: #F1F5F9; }
        .pos-dot.is-busy { border-color: #3B82F6; background: #EFF6FF; }
        .pos-dot.is-bill { border-color: #EA580C; background: #FFF7ED; }

        /* ── The floor ──────────────────────────────────────────────────
           A plan of a ROOM, not a grid of cards. Tables sit where the manager
           put them: `layout_x`/`layout_y` are the table centre as a percentage
           of this canvas, so one saved arrangement reads correctly on a 1440px
           laptop and on the 10" tablet at the host stand.

           An auto-fill grid was the old answer and it could not be right — a
           grid says every table is equidistant from every other, which is the
           one fact about a dining room that is never true. Matching what is on
           screen to what is in the room was left entirely to the cashier. */
        .pos-floor-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
        }
        .pos-floor-actions { display: flex; align-items: center; gap: 8px; }
        .pos-floor-actions svg { width: 16px; height: 16px; }

        .pos-floor {
            position: relative; overflow: hidden;
            border: 1px solid #E2E8F0; border-radius: 14px; background: #fff;
            /* Rooms are wider than they are deep, and a fixed ratio is what makes
               a percentage coordinate stable — without it the same layout
               stretches vertically every time the panel opens. */
            aspect-ratio: 16 / 9; min-height: 360px;
            background-image:
                linear-gradient(to right, #F1F5F9 1px, transparent 1px),
                linear-gradient(to bottom, #F1F5F9 1px, transparent 1px);
            background-size: 40px 40px;
        }
        @media (max-width: 700px) { .pos-floor { aspect-ratio: 3 / 4; } }
        .pos-floor.is-arranging {
            border-color: #0F172A; background-color: #F8FAFC;
            background-image:
                linear-gradient(to right, #E2E8F0 1px, transparent 1px),
                linear-gradient(to bottom, #E2E8F0 1px, transparent 1px);
        }

        /* A table, drawn as a table: a top and its chairs. The chairs are what
           make a floor plan scannable — a grid of rounded rectangles is a list
           with extra steps, and the cashier is matching what they see on screen
           to what they see in the room.

           Positioned by its CENTRE (translate -50%), because that is what a
           person means when they drag a table to a spot. */
        .pos-table {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: stretch; gap: 5px;
            background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
            width: var(--pos-table-w, 128px);
        }
        .pos-table-body {
            display: flex; flex-direction: column; justify-content: center; gap: 5px;
            min-height: var(--pos-table-h, 78px); padding: 8px 10px; border-radius: 10px;
            border: 2px solid #CBD5E1; background: #F8FAFC;
            transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }
        .pos-table:hover .pos-table-body { box-shadow: 0 4px 14px rgba(15,23,42,.12); }
        .pos-table:focus-visible { outline: 2px solid #EA580C; outline-offset: 3px; border-radius: 14px; }

        /* Chairs sit outside the top, one row each side. Small and discrete:
           full-width pale bars read as loading shimmer, which is exactly how
           the first cut of this was reported. */
        .pos-chairs { display: flex; justify-content: center; gap: 7px; height: 7px; }
        .pos-chairs i { width: 17px; height: 7px; border-radius: 4px; background: #CBD5E1; }

        /* State is carried by the LABEL and the colour together, never colour
           alone — a colour-blind cashier reads the same floor. */
        .pos-table.is-busy .pos-table-body { background: #EFF6FF; border-color: #3B82F6; }
        .pos-table.is-busy .pos-chairs i   { background: #93C5FD; }
        .pos-table.is-bill .pos-table-body { background: #FFF7ED; border-color: #EA580C; }
        .pos-table.is-bill .pos-chairs i   { background: #FDBA74; }
        .pos-table-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
        .pos-table-label { font-size: 16px; font-weight: 700; color: #0B0F19; line-height: 1; }
        .pos-table-zone { font-size: 12px; color: #94A3B8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pos-table-free { font-size: 12px; color: #94A3B8; }
        .pos-table-meta { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
        .pos-table-money { font-weight: 600; color: #1E293B; font-variant-numeric: tabular-nums; }
        .pos-table-since { color: #64748B; font-variant-numeric: tabular-nums; }

        /* Arrange mode. The tables stop being buttons and become furniture. */
        .pos-floor.is-arranging .pos-table { cursor: grab; touch-action: none; }
        .pos-floor.is-arranging .pos-table:active,
        .pos-floor.is-arranging .pos-table.is-dragging { cursor: grabbing; }
        .pos-floor.is-arranging .pos-table.is-dragging { z-index: 5; }
        .pos-floor.is-arranging .pos-table.is-dragging .pos-table-body {
            border-color: #0F172A; box-shadow: 0 10px 24px rgba(15,23,42,.18);
        }
        .pos-arrange-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
            border: 1px solid #0F172A; border-radius: 12px; background: #F8FAFC; padding: 10px 14px;
        }
        .pos-arrange-hint { font-size: 12px; color: #475569; }
        .pos-arrange-actions { display: flex; gap: 8px; }

        .pos-floor-empty {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #94A3B8;
        }

        /* Until the till's nav replaces it, the shared FINANCE nav must not
           paint. sidebar-loader.js renders Bills, Invoices, Tax Centre and the
           rest before pos.js can swap them, so on every reload a cashier saw a
           third of a second of the wrong product — and of destinations their
           role is denied. Hidden until mountTillNav() stamps the attribute, with
           the repo's shimmer idiom in its place rather than a blank column. */
        #nav-container:not([data-till-nav]) > * { display: none !important; }
        #nav-container:not([data-till-nav])::before {
            content: ''; display: block; margin: 4px 0 0;
            height: 232px; border-radius: 8px;
            background:
                linear-gradient(#E9EDF2 0 0) 0 14px / 60% 10px no-repeat,
                linear-gradient(#F1F5F9 0 0) 0 44px / 100% 34px no-repeat,
                linear-gradient(#F1F5F9 0 0) 0 86px / 100% 34px no-repeat,
                linear-gradient(#F1F5F9 0 0) 0 128px / 100% 34px no-repeat,
                linear-gradient(#F1F5F9 0 0) 0 170px / 100% 34px no-repeat;
            animation: pos-nav-pulse 1.4s ease-in-out infinite;
        }
        @keyframes pos-nav-pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
        @media (prefers-reduced-motion: reduce) {
            #nav-container:not([data-till-nav])::before { animation: none; }
        }

        /* ── Notifications ──────────────────────────────────────────────── */
        .pos-bell { position: relative; border: 0; background: none; color: #475569; padding: 7px; border-radius: 9px; cursor: pointer; }
        .pos-bell:hover { background: #F1F5F9; }
        .pos-bell:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-bell svg { width: 20px; height: 20px; display: block; }
        .pos-bell-count {
            position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px;
            padding: 0 4px; border-radius: 999px; background: #C2410C; color: #fff;
            font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .pos-bell-panel {
            position: absolute; top: 52px; right: 20px; width: min(420px, calc(100vw - 32px));
            max-height: 70vh; overflow-y: auto; z-index: 60;
            background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
            box-shadow: 0 18px 40px rgba(15,23,42,.14); padding: 6px;
        }
        .pos-bell-head {
            font-size: 12px; font-weight: 600; color: #64748B;
            padding: 8px 10px 6px; letter-spacing: .01em;
        }
        .pos-bell-panel .pos-note { margin: 0 0 6px; }
        .pos-bell-panel .pos-note:last-child { margin-bottom: 0; }
        .pos-bell-empty { padding: 18px 10px 22px; text-align: center; color: #94A3B8; font-size: 13px; }

        /* ══ The till's nav, inside the SHARED sidebar ════════════════════
           No sidebar chrome is restyled here: the logo, entity switcher,
           profile block and light theme all come from shared-dashboard.css via
           `app-sidebar-light`, and the nav items reuse `.nav-item`,
           `.section-label`, `.sidebar-icon` and `.sidebar-text` verbatim so the
           two sidebars cannot drift. Only the count badge is new. */
        .pos-nav-badge {
            margin-left: auto; font-size: 10px; font-weight: 600;
            background: #F1F5F9; color: #475569; border-radius: 999px;
            padding: 1px 7px; font-variant-numeric: tabular-nums;
        }
        .pos-nav-badge:empty { display: none; }

        /* ── Topbar ─────────────────────────────────────────────────────── */
        .pos-topbar {
            height: 60px; flex-shrink: 0; background: #fff;
            border-bottom: 1px solid #E2E8F0; display: flex; align-items: center;
            gap: 14px; padding: 0 20px; position: sticky; top: 0; z-index: 30;
        }
        .pos-burger { border: 0; background: none; color: #475569; padding: 6px; cursor: pointer; }
        .pos-burger svg { width: 22px; height: 22px; }
        .pos-topbar-outlet { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .pos-topbar-outlet label {
            font-size: 10px; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: #64748B;
        }
        .pos-topbar-outlet .fluxy-select { flex: 0 1 250px; min-width: 170px; }
        .pos-outlet-hint { font-size: 12px; color: #94A3B8; }
        .pos-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .pos-top-avatar { width: 32px; height: 32px; border-radius: 999px; }
        .pos-conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #64748B; }
        .pos-conn-dot { width: 7px; height: 7px; border-radius: 999px; background: #16A34A; }
        body.is-offline .pos-conn-dot { background: #DC2626; }
        body.is-offline .pos-conn-text::after { content: ' — offline'; }

        /* ── Page header ────────────────────────────────────────────────── */
        .pos-pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
        .pos-pagetitle { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; color: #0B0F19; line-height: 1.2; }
        .pos-crumb { margin-top: 3px; font-size: 12px; color: #94A3B8; display: flex; align-items: center; gap: 6px; }
        .pos-crumb i { font-style: normal; color: #CBD5E1; }
        .pos-pagehead-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .pos-btn-ghost, .pos-btn-primary {
            display: inline-flex; align-items: center; gap: 8px; min-height: 42px;
            padding: 0 15px; border-radius: 10px; font-size: 14px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
        }
        .pos-btn-ghost { background: #fff; border: 1px solid #E2E8F0; color: #334155; }
        .pos-btn-ghost:hover { background: #F8FAFC; }

        /* A write is in flight — see once() in pos.js.
           The guard refused re-entry in complete silence: the button stayed lit,
           the press did nothing, and the cashier pressed again. Blocking the
           pointer means the press cannot be swallowed, because it cannot be made
           — and the control says so. */
        body[data-pos-busy] { cursor: progress; }
        body[data-pos-busy] .pos-primary,
        body[data-pos-busy] .pos-card,
        body[data-pos-busy] .pos-table,
        body[data-pos-busy] .pos-ocard-btn,
        body[data-pos-busy] #pos-new-order,
        body[data-pos-busy] #pos-post-now,
        body[data-pos-busy] [data-arrange],
        body[data-pos-busy] .pos-line button,
        body[data-pos-busy] button[form="pos-drawer-form"] {
            pointer-events: none;
            opacity: .55;
            /* Delayed, so a 200ms write does not flash the whole till grey. A
               slow one dims right about when a person starts to wonder. On
               release the rule stops applying and it snaps back with no lag. */
            transition: opacity 120ms ease 180ms;
        }
        /* The arrange toggle stays visibly ON while the floor is editable —
           a mode you cannot see you are in is how a drag gets mistaken for a
           tap that should have opened an order. */
        .pos-btn-ghost.is-on { background: #0F172A; border-color: #0F172A; color: #fff; }
        .pos-btn-primary { background: #0F172A; border: 1px solid #0F172A; color: #fff; }
        .pos-btn-primary:hover:not(:disabled) { background: #1E293B; }
        .pos-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .pos-btn-ghost svg, .pos-btn-primary svg { width: 16px; height: 16px; }
        .pos-btn-count {
            font-size: 12px; font-weight: 600; background: #F1F5F9; color: #475569;
            border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums;
        }

        /* Mobile: the SHARED sidebar's own off-canvas behaviour applies
           (shared-dashboard.css ≤640px + the wiring in sidebar-loader.js, which
           binds `header button.md:hidden`). The burger below carries that exact
           selector so it is picked up rather than reimplemented. */
        @media (max-width: 900px) { .pos-topbar-outlet label { display: none; } }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-900 bg-gray-50">

    <!-- The SHARED sidebar, rendered by sidebar-loader.js exactly as every app
         page renders it — same logo, same entity switcher, same Lucide icons,
         same profile block, same light theme. Only the NAV ITEMS are swapped,
         by pos.js, for the till's four destinations.
         Building a parallel sidebar (which I did first) duplicates all of that
         chrome and guarantees the two drift apart the first time either moves. -->
    <aside id="sidebar" class="w-[220px] bg-white text-[#1E2F4A] flex flex-col flex-shrink-0 z-20 md:flex border-r border-slate-200 rounded-tl-[8px] overflow-hidden">
        <!-- Sidebar content loaded by sidebar-loader.js -->
    </aside>

    <main class="flex-1 flex flex-col h-screen relative overflow-hidden">
        <!-- ── Till topbar ────────────────────────────────────────────
             The outlet moves up here: it is the context every figure and every
             sale on this screen depends on, and it was costing a full card row
             below. The dashboard's title/subtitle pair is gone — a cashier does
             not need to be told which page they are on twice. -->
        <!-- The outlet moved into the sidebar, where the workspace switcher used
             to be: it is the one thing a cashier switches, and the workspace is
             not (they belong to exactly one). The avatar is gone too — the
             sidebar's profile block already says who is signed in, and saying it
             twice on a 60px bar earns nothing. -->
        <header class="pos-topbar">
            <button class="pos-burger md:hidden" id="pos-burger" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="pos-topbar-right">
                <span class="pos-conn" id="pos-conn"><span class="pos-conn-dot"></span><span class="pos-conn-text">Online</span></span>
                <!-- Everything that used to stack above the catalogue as a banner
                     lives here now, the way the dashboard collects what needs
                     attention rather than pushing the work down the page. -->
                <button type="button" class="pos-bell" id="pos-bell" aria-label="Notifications" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="pos-bell-count hidden" id="pos-bell-count"></span>
                </button>
                <div class="pos-bell-panel hidden" id="pos-bell-panel" role="dialog" aria-label="Notifications">
                    <div class="pos-bell-head">Needs your attention</div>
                    <div id="pos-banners"></div>
                </div>
            </div>
        </header>

        <div class="fluxy-page-shell">
            <div class="fluxy-page-canvas fluxy-section-stack">

                <!-- Page header: title + breadcrumb + actions, as the reference -->
                <div class="pos-pagehead">
                    <div>
                        <h1 class="pos-pagetitle" id="pos-view-title">Point of Sale (POS)</h1>
                        <p class="pos-crumb"><span>FluxyOS</span> <i aria-hidden="true">•</i> <span id="pos-view-crumb">Pos</span></p>
                    </div>
                    <div class="pos-pagehead-actions">
                        <button id="pos-tables-btn" type="button" class="pos-btn-ghost">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><path d="M7 11v9M17 11v9"/></svg>
                            <span>Table Order</span>
                            <span id="pos-tables-count" class="pos-btn-count hidden"></span>
                        </button>
                        <button id="pos-new-order" type="button" class="pos-btn-primary" aria-label="Start a takeaway order" title="Takeaway" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                            <span>Takeaway</span>
                        </button>
                    </div>
                </div>

                <div id="pos-offline" class="pos-offline" role="status">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636 5.636 18.364M12 20h.01M8.111 12.111a5.5 5.5 0 017.778 0M4.929 8.929a10 10 0 0114.142 0"></path></svg>
                    <span>No connection. Orders cannot be saved until this clears — do not take payment yet.</span>
                </div>

                <!-- ── VIEW: Point of Sale ───────────────────────────── -->
                <!-- ── The shell ─────────────────────────────────────────
                     The order panel is SHARED, not owned by the till view.
                     Selecting a table on the floor plan opens the order right
                     there — the same interaction as picking one from the order
                     flow. It used to sit inside the till view, so a table tap
                     had to jump views to show an order the cashier was already
                     looking at. -->
                <div class="pos-shell" id="pos-shell">
                  <div class="pos-col">
                <section class="pos-view" data-view="till">
                <div id="pos-shiftbar" class="pos-shiftbar"></div>

                <div id="pos-metrics" class="pos-metrics"></div>

                    <div class="pos-shell-left">
                    <!-- ── LEFT: the product catalogue ───────────────────────
                         The reference's central IA move: the menu is the primary
                         surface, not a section under the floor plan. Tables moved
                         behind the "Table Order" button in the header. -->
                    <div class="fluxy-section-stack" style="gap:16px;min-width:0;">
                        <section class="fluxy-table-card" id="pos-menu-card">
                            <div class="pos-catalog-toolbar">
                                <div class="pos-search">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                    <input id="pos-menu-search" type="search" autocomplete="off"
                                           placeholder="Search in products" aria-label="Search in products">
                                </div>
                                <!-- The reference also carries "All Category" and
                                     "Select Brand" dropdowns. The first duplicates
                                     the chips below; the second has no equivalent —
                                     FluxyOS items have no brand. Neither is built. -->
                                <span id="pos-menu-count" class="pos-catalog-count"></span>
                            </div>
                            <div id="pos-cat-chips" class="pos-chips" role="tablist" aria-label="Menu categories"></div>
                            <div class="pos-catalog-body">
                                <div id="pos-menu" class="pos-grid"></div>
                                <div id="pos-menu-empty" class="hidden"></div>
                            </div>
                        </section>

                    </div>

                    <!-- ── RIGHT: the order panel ────────────────────────────
                         Reference parity: existing-order search, dining + table
                         selectors, order number, line rows with qty stepper and
                         per-line notes, then the totals stack. -->

                </div>
                </section>

                <!-- ── VIEW: Tables ──────────────────────────────────────── -->
                <!-- No card around the floor. A plan of a room read through a
                     panel header, a subtitle and 16px of card padding had about
                     half the width left for the room itself, and the tables were
                     squeezed into a single cramped row. The canvas IS the
                     surface here; the controls sit above it. -->
                <section class="pos-view hidden" data-view="tables">
                    <div class="pos-floor-bar">
                        <div class="pos-legend">
                            <span><i class="pos-dot is-free"></i>Free</span>
                            <span><i class="pos-dot is-busy"></i>In use</span>
                            <span><i class="pos-dot is-bill"></i>Awaiting payment</span>
                        </div>
                        <div class="pos-floor-actions">
                            <button type="button" id="pos-arrange-btn" class="pos-btn-ghost hidden">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 9 2 12l3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
                                <span>Arrange layout</span>
                            </button>
                            <button type="button" id="pos-manage-tables" class="pos-btn-ghost">Manage tables</button>
                        </div>
                    </div>
                    <div id="pos-tables"></div>
                    <div id="pos-tables-empty" class="hidden"></div>
                </section>

                <!-- ── VIEW: Orders ──────────────────────────────────────── -->
                <!-- Operational, not a marketing dashboard: a compact header,
                     tabs and controls on one line, then the grid. Spacing here
                     is deliberately tighter than the rest of the app — this is a
                     surface a cashier SCANS, and density is the feature. -->
                <section class="pos-view hidden" data-view="orders">
                    <!-- No second "Orders" heading here: the page head above
                         already says it, and a repeated title costs a whole row
                         of a surface that is scanned. The date rides with the
                         tabs instead. -->
                    <div class="pos-orders-bar">
                        <div class="pos-orders-left">
                            <div class="pos-tabs" role="tablist" aria-label="Order status">
                                <button type="button" role="tab" aria-selected="true" class="pos-tab is-active" data-otab="all">All</button>
                                <button type="button" role="tab" aria-selected="false" class="pos-tab" data-otab="process">In Process</button>
                                <button type="button" role="tab" aria-selected="false" class="pos-tab" data-otab="done">Completed</button>
                            </div>
                            <span class="pos-orders-date" id="pos-orders-date"></span>
                        </div>
                        <div class="pos-orders-controls">
                            <button type="button" class="pos-filter-btn" id="pos-orders-filter" aria-label="Filter orders" aria-expanded="false">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
                            </button>
                            <div class="pos-search pos-search-sm">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                <input id="pos-orders-search" type="search" autocomplete="off"
                                       placeholder="Search by name, order, table..." aria-label="Search orders">
                            </div>
                        </div>
                    </div>
                    <div id="pos-orders-grid" class="pos-orders-grid"></div>
                    <div id="pos-orders-empty" class="hidden"></div>
                </section>

                <!-- ── VIEW: Shift ───────────────────────────────────────── -->
                <section class="pos-view hidden" data-view="shift">
                    <div id="pos-shiftbar-full" class="pos-shiftbar"></div>
                    <section class="fluxy-table-card" style="margin-top:16px;">
                        <div class="fluxy-table-card-header">
                            <div>
                                <h2 class="fluxy-table-title">Recent shifts</h2>
                                <p class="fluxy-table-subtitle">Each close records what was counted against what was expected.</p>
                            </div>
                        </div>
                        <div style="padding:12px 16px;">
                            <div id="pos-shift-history"></div>
                        </div>
                    </section>
                </section>
                  </div>

                    <aside class="pos-order" id="pos-order-panel" aria-live="polite">
                        <div class="pos-order-head">
                            <div class="pos-search pos-search-sm">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                <input id="pos-order-search" type="search" autocomplete="off"
                                       placeholder="Search in existing" aria-label="Search open orders">
                            </div>
                            <div id="pos-order-results" class="pos-order-results hidden"></div>
                            <div class="pos-order-selects">
                                <select id="pos-dining" aria-label="Dining type">
                                    <option value="dine_in">Dine in</option>
                                    <option value="takeaway">Takeaway</option>
                                </select>
                                <select id="pos-table-select" aria-label="Table"></select>
                            </div>
                            <div class="pos-order-id">
                                <span class="pos-order-id-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 2h12l2 6H4z"/><path d="M5 8v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
                                </span>
                                <h2 id="pos-order-title">No order open</h2>
                                <span id="pos-order-status" class="fluxy-status hidden"></span>
                            </div>
                            <p id="pos-order-sub" class="pos-order-sub">Pick a table to start.</p>
                        </div>

                        <div id="pos-order-lines" class="pos-order-lines"></div>

                        <div class="pos-order-foot">
                            <div id="pos-order-totals"></div>
                            <button id="pos-primary" type="button" class="pos-primary" disabled>Pick a table</button>
                            <div class="pos-order-actions">
                                <button id="pos-discount-btn" type="button" class="pos-secondary hidden">Add discount</button>
                                <button id="pos-void-btn" type="button" class="pos-secondary hidden">Void order</button>
                                <button id="pos-refund-btn" type="button" class="pos-secondary hidden">Refund order</button>
                                <button id="pos-reprint-btn" type="button" class="pos-secondary hidden">Reprint receipt</button>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3"></div>

    <script src="assets/js/money-format.js"></script>
    <script src="assets/js/sidebar-loader.js"></script>
    <script src="assets/js/fluxy-select.js"></script>
    <!-- No footer-loader.js. The marketing footer must never load on an app page
         (PROJECT_BACKGROUND §3) — it auto-runs on include and paints over the
         entire content area. -->
    <script src="assets/js/shared-dashboard.js"></script>
    <!-- Bahasa-first: Indonesian is the default, English is the opt-out via
         Settings → Language (docs/LOCALIZATION_PLAN.md). -->
    <script src="assets/js/dashboard-i18n.js"></script>
    <script type="module" src="assets/js/pos.js"></script>
</body>
</html>
