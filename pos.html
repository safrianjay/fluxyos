<!DOCTYPE html>
<html lang="en" class="fluxy-booting">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxyOS | Point of Sale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-dashboard.css">
    <link rel="stylesheet" href="assets/css/accounting.css">
    <style>
        /* ── The till is a MOBILE surface first ──────────────────────────────
           Every other app page is a desktop finance screen that also works on a
           phone. This one is the reverse: it is used standing up, one-handed,
           on a phone or a small tablet. So the layout is designed at 375px and
           widens, and every tap target is >= 44px.

           Everything here reuses the shared type scale and the semantic status
           colours already in shared-dashboard.css. No new visual language. */

        .pos-shell { display: grid; gap: 16px; grid-template-columns: 1fr; }
        /* Side-by-side is decided by the space actually AVAILABLE, not by the
           viewport — because the 220px sidebar is what really governs it.
           Measuring the viewport, a 10" tablet in portrait (834pt) looks wide
           enough and is not: 834 − 220 sidebar − 48 padding − 320 panel leaves
           the catalogue 202px, about 90px per card. A container query asks the
           canvas instead, so the sidebar is counted automatically.
           It also means this starts working on a portrait tablet the moment the
           cashier shell drops the sidebar (Phase 3) — no breakpoint to revisit. */
        .fluxy-page-canvas { container-type: inline-size; }
        @container (min-width: 720px) {
            .pos-shell { grid-template-columns: minmax(0,1fr) 320px; align-items: start; }
        }
        @container (min-width: 1040px) {
            .pos-shell { grid-template-columns: minmax(0,1fr) 380px; }
        }
        /* Viewport fallback for engines without container queries. */
        @supports not (container-type: inline-size) {
            @media (min-width: 1024px) { .pos-shell { grid-template-columns: minmax(0,1fr) 380px; align-items: start; } }
        }

        /* ── Outlet bar ─────────────────────────────────────────────────── */
        .pos-outletbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 14px; background: #fff; border: 1px solid #E2E8F0;
            border-radius: 12px;
        }
        .pos-outletbar label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: #64748B;
        }
        /* fluxy-select.js wraps the native control in a block-level element that
           takes the whole flex row unless it is pinned. Left alone the outlet
           picker stretched to ~1500px for a two-word value. */
        .pos-outletbar .fluxy-select { flex: 0 1 260px; min-width: 180px; }

        /* ── Shift bar ──────────────────────────────────────────────────── */
        .pos-shiftbar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 12px 14px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
        }
        .pos-shiftbar.is-closed { border-style: dashed; background: #F8FAFC; }
        .pos-shift-state {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 13px; font-weight: 600; color: #0F172A;
        }
        /* A dot plus a word. The dot alone would be colour-only status. */
        .pos-shift-dot { width: 8px; height: 8px; border-radius: 50%; background: #CBD5E1; flex-shrink: 0; }
        .pos-shiftbar.is-open .pos-shift-dot { background: #16A34A; }
        .pos-shift-meta { font-size: 12px; color: #64748B; font-variant-numeric: tabular-nums; }
        .pos-shift-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .pos-shift-btn {
            min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; border: 1px solid #E2E8F0;
            background: #fff; color: #334155;
        }
        .pos-shift-btn:hover { background: #F8FAFC; }
        .pos-shift-btn.is-primary { background: #0F172A; color: #fff; border-color: #0F172A; }
        .pos-shift-btn.is-primary:hover { background: #1E293B; }

        /* Blind close: the count goes in before the expectation comes out. */
        .pos-count-reveal { border-top: 1px solid #E2E8F0; margin-top: 16px; padding-top: 16px; }
        .pos-variance {
            display: flex; align-items: baseline; justify-content: space-between;
            font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
            padding: 10px 12px; border-radius: 8px; margin-top: 10px;
        }
        .pos-variance.is-ok    { background: #E8F3EC; color: #15803D; }
        .pos-variance.is-short { background: #FBECEC; color: #B91C1C; }
        .pos-variance.is-over  { background: #FBF3E2; color: #A16207; }

        /* ── Metric strip ───────────────────────────────────────────────── */
        .pos-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #E2E8F0; border: 1px solid #E2E8F0; border-radius: 12px; overflow: hidden; }
        @media (min-width: 640px) { .pos-metrics { grid-template-columns: repeat(4, 1fr); } }
        .pos-metric { background: #fff; padding: 14px 16px; }
        /* On a phone the four metrics push the catalogue most of a screen down.
           They stay (they carry the unposted + no-cost-basis honesty signals)
           but give up ~50px of chrome for it. */
        @media (max-width: 640px) {
            .pos-metric { padding: 10px 12px; }
            .pos-metric-value { font-size: 17px; }
            .pos-metric-label { margin-top: 5px; }
        }
        .pos-metric-value {
            font-size: 20px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; color: #0B0F19;
        }
        .pos-metric-label {
            margin-top: 8px; font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: #64748B;
        }
        /* Semantic only — a hue with no meaning is the one thing worth leaving out. */
        .pos-metric-value.is-warn { color: #EA580C; }

        /* ── Table grid ─────────────────────────────────────────────────── */
        .pos-tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
        .pos-table {
            position: relative; min-height: 88px; padding: 12px 10px;
            background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
            display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
            cursor: pointer; text-align: left; transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .pos-table:hover { border-color: #CBD5E1; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
        .pos-table:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-table-label { font-size: 16px; font-weight: 600; color: #0B0F19; line-height: 1.2; }
        .pos-table-zone { font-size: 10px; color: #94A3B8; margin-top: 2px; }
        .pos-table-foot { font-size: 12px; font-weight: 500; margin-top: 10px; font-variant-numeric: tabular-nums; }
        /* Status is carried by TEXT and a left rule, never by colour alone —
           a colour-blind cashier reads the same grid. */
        .pos-table.is-free { border-left: 3px solid #CBD5E1; }
        .pos-table.is-busy { border-left: 3px solid #3B82F6; }
        .pos-table.is-bill { border-left: 3px solid #EA580C; }
        .pos-table.is-free .pos-table-foot { color: #94A3B8; }
        .pos-table.is-busy .pos-table-foot { color: #1D4ED8; }
        .pos-table.is-bill .pos-table-foot { color: #C2410C; font-weight: 600; }

        /* ── Order panel ────────────────────────────────────────────────── */
        .pos-order { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { .pos-order { position: sticky; top: 16px; max-height: calc(100vh - 140px); } }
        .pos-order-head { padding: 14px 16px; border-bottom: 1px solid #E2E8F0; }
        .pos-order-lines { flex: 1; overflow-y: auto; min-height: 120px; max-height: 44vh; }
        /* With no order open there is nothing to scroll, and reserving the
           minimum left a dead gap between the heading and the only action. */
        .pos-order.is-empty .pos-order-lines { min-height: 0; }
        .pos-order.is-empty .pos-order-foot { border-top: 0; background: #fff; }
        .pos-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #F1F5F9; }
        .pos-line-name { font-size: 14px; font-weight: 500; color: #0F172A; }
        .pos-line-meta { font-size: 12px; color: #64748B; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .pos-line-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #0F172A; text-align: right; white-space: nowrap; }
        .pos-line-strike { text-decoration: line-through; color: #94A3B8; font-weight: 400; font-size: 12px; display: block; }
        .pos-qty { display: inline-flex; align-items: center; gap: 2px; margin-top: 6px; }
        .pos-qty button {
            width: 30px; height: 30px; border: 1px solid #E2E8F0; background: #fff; border-radius: 6px;
            font-size: 14px; line-height: 1; color: #475569; cursor: pointer;
        }
        .pos-qty button:hover { background: #F8FAFC; }
        .pos-qty span { min-width: 30px; text-align: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        /* Note and discount sit apart from the +/- pair: they are occasional,
           and adjacent same-weight buttons is how the wrong one gets pressed
           on a phone mid-service. */
        .pos-qty-alt { margin-left: 6px; color: #94A3B8; font-size: 12px; }
        .pos-qty-alt:hover { color: #0F172A; }
        .pos-order-foot { padding: 14px 16px; border-top: 1px solid #E2E8F0; background: #F8FAFC; border-radius: 0 0 12px 12px; }
        .pos-total-row { display: flex; justify-content: space-between; font-size: 13px; color: #475569; padding: 3px 0; font-variant-numeric: tabular-nums; }
        .pos-total-row.is-grand { font-size: 16px; font-weight: 600; color: #0B0F19; padding-top: 8px; margin-top: 6px; border-top: 1px solid #E2E8F0; }
        .pos-total-row.is-discount { color: #C2410C; }

        /* One primary action per zone. The label changes with status; there is
           never a second button at the same weight beside it. */
        .pos-primary {
            width: 100%; min-height: 48px; margin-top: 12px; border-radius: 10px;
            background: #0F172A; color: #fff; font-size: 15px; font-weight: 600;
            border: none; cursor: pointer; transition: background 120ms ease;
        }
        .pos-primary:hover:not(:disabled) { background: #1E293B; }
        .pos-primary:disabled { opacity: .45; cursor: not-allowed; }
        .pos-secondary {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
            background: none; border: none; padding: 6px 0; cursor: pointer;
            font-size: 12px; font-weight: 500; color: #64748B;
        }
        .pos-secondary:hover { color: #B91C1C; }

        /* ── Menu ───────────────────────────────────────────────────────── */
        .pos-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .pos-menu-item {
            min-height: 76px; padding: 12px; background: #fff; border: 1px solid #E2E8F0;
            border-radius: 10px; text-align: left; cursor: pointer;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .pos-menu-item:hover { border-color: #CBD5E1; background: #F8FAFC; }
        .pos-menu-item:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-menu-item:disabled { opacity: .5; cursor: not-allowed; }
        .pos-menu-name { font-size: 13px; font-weight: 500; color: #0F172A; line-height: 1.3; }
        .pos-menu-price { font-size: 13px; font-weight: 600; color: #475569; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .pos-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #94A3B8; margin: 14px 0 8px; }
        .pos-cat:first-child { margin-top: 0; }

        /* ── Paid today ─────────────────────────────────────────────────── */
        .pos-paid-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 100%; min-height: 44px; padding: 8px 10px; border: 0; background: none;
            border-bottom: 1px solid #F1F5F9; cursor: pointer; text-align: left;
        }
        .pos-paid-row:last-child { border-bottom: 0; }
        .pos-paid-row:hover { background: #F8FAFC; }
        .pos-paid-label { font-size: 14px; font-weight: 500; color: #0F172A; display: block; }
        .pos-paid-meta { font-size: 12px; color: #94A3B8; display: block; margin-top: 2px; }
        .pos-paid-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #0F172A; white-space: nowrap; }
        .pos-paid-amt.is-void { text-decoration: line-through; color: #94A3B8; }

        /* ── Payment ────────────────────────────────────────────────────── */
        .pos-methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
        .pos-method {
            min-height: 44px; border: 1px solid #E2E8F0; background: #fff; border-radius: 8px;
            font-size: 13px; font-weight: 500; color: #334155; cursor: pointer;
        }
        .pos-method.is-on { border-color: #0F172A; background: #0F172A; color: #fff; }
        .pos-amount-input {
            width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px;
            font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
            text-align: right; color: #0B0F19;
        }
        .pos-amount-input:focus { outline: 2px solid #EA580C; outline-offset: -1px; border-color: transparent; }

        /* ── Honesty banners ────────────────────────────────────────────── */
        .pos-note {
            display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; line-height: 1.45; border: 1px solid;
        }
        .pos-note svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
        .pos-note.is-warn { background: #FFF7ED; border-color: #FED7AA; color: #9A3412; }
        .pos-note.is-info { background: #F8FAFC; border-color: #E2E8F0; color: #475569; }
        .pos-note a { font-weight: 600; text-decoration: underline; color: inherit; }

        .pos-offline {
            display: none; align-items: center; gap: 8px; padding: 10px 14px;
            background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
            border-radius: 10px; font-size: 13px; font-weight: 500;
        }
        body.is-offline .pos-offline { display: flex; }

        @media (max-width: 640px) {
            .pos-tables { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
            .pos-menu-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }

        /* ══ Reference-aligned catalogue (RestroBit layout, FluxyOS tokens) ══
           Same information architecture as the reference — search, category
           chips, a 4-up product grid, and a right-hand order panel — built from
           the shared scale and the semantic colours already in
           shared-dashboard.css. No new visual language, and no orange fills:
           orange is an accent here as it is everywhere else in the product. */

        .pos-catalog-toolbar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 14px 16px; border-bottom: 1px solid #E2E8F0;
        }
        .pos-catalog-count {
            margin-left: auto; font-size: 12px; color: #64748B;
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }

        /* Search: one shape, two sizes. The reference uses a leading magnifier
           on both the product search and the order search. */
        .pos-search { position: relative; flex: 1 1 240px; min-width: 180px; }
        .pos-search svg {
            position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; color: #94A3B8; pointer-events: none;
        }
        .pos-search input {
            width: 100%; min-height: 40px; padding: 0 12px 0 34px;
            border: 1px solid #E2E8F0; border-radius: 10px; background: #fff;
            font-size: 14px; color: #0F172A; outline: none;
        }
        .pos-search input::placeholder { color: #94A3B8; }
        .pos-search input:focus { border-color: #CBD5E1; box-shadow: 0 0 0 3px rgba(15,23,42,.05); }
        .pos-search-sm { flex: 1 1 auto; }
        .pos-search-sm input { min-height: 36px; font-size: 13px; }

        /* Category chips. The reference fills the active chip orange; orange
           backgrounds are prohibited project-wide (CLAUDE.md), so the active
           state is the same dark navy every primary control uses. */
        .pos-chips {
            display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
            border-bottom: 1px solid #E2E8F0; scrollbar-width: thin;
        }
        .pos-chip {
            flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 999px;
            border: 1px solid #E2E8F0; background: #fff; color: #475569;
            font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
            transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        .pos-chip:hover { background: #F8FAFC; border-color: #CBD5E1; }
        .pos-chip:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-chip.is-active { background: #0F172A; border-color: #0F172A; color: #fff; }

        .pos-catalog-body { padding: 16px; }

        /* Product grid. 4-up on desktop like the reference, stepping down to 2
           on a phone — the till is used one-handed and a 3rd column at 375px
           puts the price below the fold of the card. */
        .pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
        @media (min-width: 640px)  { .pos-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        @media (min-width: 1280px) { .pos-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }

        .pos-card {
            position: relative; display: flex; flex-direction: column; text-align: left;
            background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
            padding: 10px; cursor: pointer; min-height: 44px;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .pos-card:hover:not(:disabled) { border-color: #CBD5E1; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
        .pos-card:focus-visible { outline: 2px solid #EA580C; outline-offset: 2px; }
        .pos-card:disabled { opacity: .55; cursor: not-allowed; }

        /* THE IMAGE SLOT. `items` has no image field yet (docs/data-model/items.md),
           and the brief is explicit: do not invent placeholder imagery. So the
           slot is real and reserved, filled for now by the item's own initials on
           a neutral tile. When items gain an image, an <img> drops in here and
           nothing around it moves. */
        .pos-card-media {
            aspect-ratio: 4 / 3; border-radius: 8px; background: #F1F5F9;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 10px; flex-shrink: 0;
        }
        .pos-card-media img { width: 100%; height: 100%; object-fit: cover; }
        .pos-card-initial {
            font-size: 20px; font-weight: 600; color: #94A3B8; letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .pos-card-name {
            font-size: 14px; font-weight: 500; color: #0F172A; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pos-card-price {
            margin-top: 6px; font-size: 14px; font-weight: 600; color: #C2410C;
            font-variant-numeric: tabular-nums;
        }
        .pos-card-add {
            position: absolute; right: 10px; bottom: 10px; width: 28px; height: 28px;
            border-radius: 999px; border: 0; background: #0F172A; color: #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 16px; line-height: 1; cursor: pointer;
        }
        .pos-card:hover .pos-card-add,
        .pos-card:focus-within .pos-card-add { display: flex; }
        /* Touch has no hover: on a tablet the affordance must always be visible. */
        @media (hover: none) { .pos-card-add { display: flex; } }
        .pos-card-warn { font-size: 11px; color: #A16207; margin-top: 4px; }

        /* ── Order panel, reference shape ───────────────────────────────── */
        .pos-order-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .pos-order-selects select {
            width: 100%; min-height: 36px; padding: 0 10px; font-size: 13px;
            border: 1px solid #E2E8F0; border-radius: 10px; background: #fff; color: #0F172A;
        }
        .pos-order-id { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .pos-order-id-icon { width: 22px; height: 22px; color: #0F172A; flex-shrink: 0; }
        .pos-order-id-icon svg { width: 100%; height: 100%; }
        .pos-order-id h2 { font-size: 16px; font-weight: 600; color: #0B0F19; letter-spacing: -0.01em; }
        .pos-order-sub { font-size: 12px; color: #64748B; margin-top: 4px; }

        .pos-order-results {
            margin-top: 8px; border: 1px solid #E2E8F0; border-radius: 10px;
            overflow: hidden; max-height: 190px; overflow-y: auto;
        }
        .pos-order-result {
            display: flex; justify-content: space-between; gap: 8px; width: 100%;
            padding: 9px 12px; background: #fff; border: 0; border-bottom: 1px solid #F1F5F9;
            font-size: 13px; color: #0F172A; cursor: pointer; text-align: left;
        }
        .pos-order-result:last-child { border-bottom: 0; }
        .pos-order-result:hover { background: #F8FAFC; }
        .pos-order-result span:last-child { color: #64748B; font-variant-numeric: tabular-nums; }

        /* A line row, matching the reference: name, `price × qty = total`, a
           stepper, a remove control, and a notes affordance. */
        .pos-line-calc { font-size: 12px; color: #C2410C; font-variant-numeric: tabular-nums; margin-top: 2px; }
        .pos-line-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .pos-line-remove {
            width: 26px; height: 26px; border-radius: 7px; border: 1px solid #F1D5D7;
            background: #FEF2F2; color: #B91C1C; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .pos-line-remove:hover { background: #FEE2E2; }
        .pos-line-remove svg { width: 13px; height: 13px; }
        .pos-line-note-btn {
            display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
            padding: 0 9px; border-radius: 7px; border: 1px solid #E2E8F0;
            background: #fff; color: #475569; font-size: 12px; cursor: pointer;
        }
        .pos-line-note-btn:hover { background: #F8FAFC; }
        .pos-line-note-btn svg { width: 12px; height: 12px; }
        .pos-line-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        /* Totals stack. The reference's editable rows carry a pencil; here it
           opens the discount drawer that already exists. */
        .pos-total-edit {
            border: 0; background: none; color: #64748B; cursor: pointer;
            padding: 0 0 0 6px; line-height: 1;
        }
        .pos-total-edit:hover { color: #C2410C; }
        .pos-total-edit svg { width: 12px; height: 12px; }

        .pos-order-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .pos-order-actions .pos-secondary { flex: 1 1 auto; }

        /* Floor plan, now behind the "Table Order" button. */
        .pos-tablesheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-900 bg-gray-50">

    <aside id="sidebar" class="w-[220px] bg-white text-[#1E2F4A] flex flex-col flex-shrink-0 z-20 md:flex border-r border-slate-200 rounded-tl-[8px] overflow-hidden">
        <!-- Sidebar content loaded by sidebar-loader.js -->
    </aside>

    <main class="flex-1 flex flex-col h-screen relative overflow-hidden">
        <header class="dashboard-main-topbar h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0 z-30 sticky top-0 shadow-sm gap-3">
            <div class="dashboard-topbar-left flex items-center gap-3 min-w-0 flex-1">
                <button class="md:hidden text-gray-500 hover:text-gray-900" aria-label="Open menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="dashboard-topbar-copy min-w-0">
                    <span class="dashboard-topbar-title">Point of Sale</span>
                    <p class="dashboard-topbar-subtitle hidden sm:block">What is happening in the room right now.</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Reference parity: "Table Order" opens the floor plan. The grid
                     did not disappear — it moved behind this button so the product
                     catalogue can be the primary surface, which is the reference's
                     core IA change. QR Menu Orders and Draft List are deliberately
                     absent: QR ordering is not built and FluxyOS has no draft
                     order state, and a button that does nothing is worse than one
                     that is missing. -->
                <button id="pos-tables-btn" type="button" class="px-3 sm:px-4 py-2 min-h-[44px] bg-white border border-gray-200 text-gray-700 rounded-lg text-[14px] font-semibold hover:bg-gray-50 transition-all flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><path d="M7 11v9M17 11v9"/></svg>
                    <span class="hidden sm:inline">Table Order</span>
                    <span id="pos-tables-count" class="fluxy-status fluxy-status-neutral hidden"></span>
                </button>
                <button id="pos-new-order" type="button" aria-label="Start a takeaway order" title="Takeaway" class="px-3 sm:px-4 py-2 min-h-[44px] bg-gray-900 text-white rounded-lg text-[14px] font-bold hover:bg-gray-800 transition-all flex items-center gap-2 shadow-sm active:scale-95 whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"></path></svg>
                    <span class="hidden sm:inline">Takeaway</span>
                </button>
            </div>
        </header>

        <div class="fluxy-page-shell">
            <div class="fluxy-page-canvas fluxy-section-stack">

                <div id="pos-offline" class="pos-offline" role="status">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636 5.636 18.364M12 20h.01M8.111 12.111a5.5 5.5 0 017.778 0M4.929 8.929a10 10 0 0114.142 0"></path></svg>
                    <span>No connection. Orders cannot be saved until this clears — do not take payment yet.</span>
                </div>

                <!-- Outlet first: without it a sale cannot be attributed and lands
                     in "Unassigned" on the outlet P&L. Remembered per device. -->
                <div class="pos-outletbar">
                    <label for="pos-outlet">Outlet</label>
                    <!-- Plain <select>. fluxy-select.js enhances it into the shared
                         custom dropdown automatically (DESIGN_SYSTEM §6 — never the
                         native control). Do NOT hand-apply `.fluxy-select-native`:
                         that is the visually-hidden class the ENHANCER applies to the
                         underlying element, so setting it without the enhancer loaded
                         hides the control and leaves a bare "Outlet" label. -->
                    <select id="pos-outlet" style="min-width:200px;"></select>
                    <span id="pos-outlet-hint" class="text-[12px] text-slate-500"></span>
                </div>

                <div id="pos-shiftbar" class="pos-shiftbar"></div>

                <div id="pos-banners" class="fluxy-section-stack" style="gap:8px;"></div>

                <div id="pos-metrics" class="pos-metrics"></div>

                <div class="pos-shell">
                    <!-- ── LEFT: the product catalogue ───────────────────────
                         The reference's central IA move: the menu is the primary
                         surface, not a section under the floor plan. Tables moved
                         behind the "Table Order" button in the header. -->
                    <div class="fluxy-section-stack" style="gap:16px;min-width:0;">
                        <section class="fluxy-table-card" id="pos-menu-card">
                            <div class="pos-catalog-toolbar">
                                <div class="pos-search">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                    <input id="pos-menu-search" type="search" autocomplete="off"
                                           placeholder="Search in products" aria-label="Search in products">
                                </div>
                                <!-- The reference also carries "All Category" and
                                     "Select Brand" dropdowns. The first duplicates
                                     the chips below; the second has no equivalent —
                                     FluxyOS items have no brand. Neither is built. -->
                                <span id="pos-menu-count" class="pos-catalog-count"></span>
                            </div>
                            <div id="pos-cat-chips" class="pos-chips" role="tablist" aria-label="Menu categories"></div>
                            <div class="pos-catalog-body">
                                <div id="pos-menu" class="pos-grid"></div>
                                <div id="pos-menu-empty" class="hidden"></div>
                            </div>
                        </section>

                        <section class="fluxy-table-card hidden" id="pos-paid-card">
                            <div class="fluxy-table-card-header">
                                <div>
                                    <h2 class="fluxy-table-title">Paid today</h2>
                                    <p class="fluxy-table-subtitle">Open one to reprint its receipt or refund it.</p>
                                </div>
                            </div>
                            <div style="padding:12px 16px;">
                                <div id="pos-paid-today"></div>
                            </div>
                        </section>
                    </div>

                    <!-- ── RIGHT: the order panel ────────────────────────────
                         Reference parity: existing-order search, dining + table
                         selectors, order number, line rows with qty stepper and
                         per-line notes, then the totals stack. -->
                    <aside class="pos-order" id="pos-order-panel" aria-live="polite">
                        <div class="pos-order-head">
                            <div class="pos-search pos-search-sm">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                <input id="pos-order-search" type="search" autocomplete="off"
                                       placeholder="Search in existing" aria-label="Search open orders">
                            </div>
                            <div id="pos-order-results" class="pos-order-results hidden"></div>
                            <div class="pos-order-selects">
                                <select id="pos-dining" aria-label="Dining type">
                                    <option value="dine_in">Dine in</option>
                                    <option value="takeaway">Takeaway</option>
                                </select>
                                <select id="pos-table-select" aria-label="Table"></select>
                            </div>
                            <div class="pos-order-id">
                                <span class="pos-order-id-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 2h12l2 6H4z"/><path d="M5 8v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
                                </span>
                                <h2 id="pos-order-title">No order open</h2>
                                <span id="pos-order-status" class="fluxy-status hidden"></span>
                            </div>
                            <p id="pos-order-sub" class="pos-order-sub">Pick a table to start.</p>
                        </div>

                        <div id="pos-order-lines" class="pos-order-lines"></div>

                        <div class="pos-order-foot">
                            <div id="pos-order-totals"></div>
                            <button id="pos-primary" type="button" class="pos-primary" disabled>Pick a table</button>
                            <div class="pos-order-actions">
                                <button id="pos-discount-btn" type="button" class="pos-secondary hidden">Add discount</button>
                                <button id="pos-void-btn" type="button" class="pos-secondary hidden">Void order</button>
                                <button id="pos-refund-btn" type="button" class="pos-secondary hidden">Refund order</button>
                                <button id="pos-reprint-btn" type="button" class="pos-secondary hidden">Reprint receipt</button>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3"></div>

    <script src="assets/js/money-format.js"></script>
    <script src="assets/js/sidebar-loader.js"></script>
    <script src="assets/js/fluxy-select.js"></script>
    <!-- No footer-loader.js. The marketing footer must never load on an app page
         (PROJECT_BACKGROUND §3) — it auto-runs on include and paints over the
         entire content area. -->
    <script src="assets/js/shared-dashboard.js"></script>
    <!-- Bahasa-first: Indonesian is the default, English is the opt-out via
         Settings → Language (docs/LOCALIZATION_PLAN.md). -->
    <script src="assets/js/dashboard-i18n.js"></script>
    <script type="module" src="assets/js/pos.js"></script>
</body>
</html>
