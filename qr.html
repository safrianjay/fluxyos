<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan to Register — FluxyOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="description" content="Scan to register your interest in FluxyOS.">
    <!-- Display/print asset for one event, not a page for search. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0B0F19">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0B0F19; color: #fff;
            display: flex; align-items: center; justify-content: center;
            padding: clamp(1rem, 4vw, 3rem);
            /* Sized to be legible from a couple of metres on a stand or a screen. */
            text-align: center;
        }
        /* Ambient brand glow. Decorative only, and behind everything — an
           animated pseudo-element that paints over content is a Safari-only bug
           we have hit before, so it is pinned to z-index:-1 rather than relying
           on stacking order. */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(60rem 40rem at 50% -10%, rgba(234,88,12,.20), transparent 60%),
                radial-gradient(50rem 35rem at 50% 110%, rgba(124,58,237,.22), transparent 60%);
        }
        .wrap { width: 100%; max-width: 660px; }
        .eyebrow {
            font-size: clamp(11px, 1.5vw, 13px); font-weight: 800;
            letter-spacing: .18em; text-transform: uppercase; color: #EA580C;
        }
        h1 {
            margin: .75rem 0 0; font-weight: 900; letter-spacing: -.03em;
            font-size: clamp(2rem, 6.5vw, 3.5rem); line-height: 1.02;
        }
        .sub {
            margin: .9rem auto 0; max-width: 30ch; color: #94A3B8;
            font-size: clamp(15px, 2.1vw, 19px); line-height: 1.55;
        }
        .card {
            margin: clamp(1.5rem, 4vw, 2.5rem) auto 0;
            width: min(78vw, 380px); aspect-ratio: 1;
            background: #fff; border-radius: 24px;
            padding: clamp(.75rem, 2vw, 1.15rem);
            box-shadow: 0 30px 70px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08);
        }
        .qr-svg { display: block; width: 100%; height: 100%; }
        .url {
            margin-top: clamp(1rem, 3vw, 1.5rem);
            font-size: clamp(13px, 1.9vw, 16px); font-weight: 600;
            color: #CBD5E1; font-variant-numeric: tabular-nums;
        }
        .url span { color: #fff; }
        .foot {
            margin-top: .5rem; font-size: clamp(11px, 1.5vw, 13px); color: #64748B;
        }
        /* Print: black on white, QR as large as the sheet allows. Someone will
           print this rather than show a screen, and a dark background would
           empty a toner cartridge and scan worse. */
        @media print {
            @page { margin: 12mm; }
            body { background: #fff; color: #0B0F19; display: block; padding: 0; }
            body::before { display: none; }
            .eyebrow { color: #EA580C; }
            .sub { color: #475569; }
            .card { width: 118mm; box-shadow: none; border: 1px solid #E2E8F0; margin-top: 10mm; }
            .url { color: #0B0F19; }
            .foot { color: #64748B; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
</head>
<body>

        <p class="eyebrow">FluxyOS</p>
        <h1>Scan to register</h1>
        <p class="sub">Point your camera here. Takes under a minute.</p>

</svg>
